<!doctype html>
<html lang="en">
<head>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Green Square</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f4f4;
      font-family: system-ui, sans-serif;
    }
    .square {
      width: 240px;
      height: 240px;
      background: #2e9e4f;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 16px;
      box-sizing: border-box;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="square">Hello from the green square</div>
</body>
</html>
