version: "2"
sql:
  - engine: "sqlite"
    queries: "storage/primarydb/pq/sql/queries.sql"
    schema:
      - "storage/primarydb/pq/sql/schema.sql"
      - "storage/primarydb/pq/sql/schema_authz.sql"
      - "storage/primarydb/pq/sql/schema_deployments.sql"
      - "storage/primarydb/pq/sql/schema_scheduled_instances.sql"
      - "storage/primarydb/pq/sql/schema_secrets.sql"
      - "storage/primarydb/pq/sql/schema_configs.sql"
      - "storage/primarydb/pq/sql/schema_assets.sql"
      - "storage/primarydb/pq/sql/schema_network_policies.sql"
      - "storage/primarydb/pq/sql/schema_nodes.sql"
    gen:
      go:
        package: "pq"
        out: "storage/primarydb/pq"
        rename:
          node: NodeRow
  - engine: "sqlite"
    queries: "storage/secondarydb/sq/sql/queries.sql"
    schema:
      - "storage/secondarydb/sq/sql/schema.sql"
    gen:
      go:
        package: "sq"
        out: "storage/secondarydb/sq"
  - engine: "sqlite"
    queries: "storage/logdb/sql/queries.sql"
    schema:
      - "storage/logdb/sql/schema.sql"
    gen:
      go:
        package: "logdb"
        out: "storage/logdb"
