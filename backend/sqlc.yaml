version: "2"
sql:
  - engine: "sqlite"
    queries: "storage/sqlite/sql/queries.sql"
    schema:
      - "storage/sqlite/sql/schema.sql"
      - "storage/sqlite/sql/schema_deployments.sql"
      - "storage/sqlite/sql/schema_secrets.sql"
      - "storage/sqlite/sql/schema_configs.sql"
      - "storage/sqlite/sql/schema_assets.sql"
    gen:
      go:
        package: "sqlite"
        out: "storage/sqlite"
        rename:
          node: NodeRow
