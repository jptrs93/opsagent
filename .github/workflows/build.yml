name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v0.1.0)'
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build linux/${{ matrix.arch }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - arch: amd64
          - arch: arm64
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          check-latest: true
          cache-dependency-path: backend/go.sum

      - name: Build frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Check for reachable vulnerabilities
        working-directory: backend
        env:
          TARGET_GOARCH: ${{ matrix.arch }}
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          GOOS=linux GOARCH="$TARGET_GOARCH" "$(go env GOPATH)/bin/govulncheck" ./...

      - name: Build backend
        working-directory: backend
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          VERSION: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "invalid version tag: $VERSION" >&2
            exit 1
          fi
          go build -trimpath -ldflags="-s -w -X github.com/jptrs93/opsagent/backend/util/version.Version=${VERSION}" -o "opendeploy-linux-${GOARCH}" .
          if ! file "opendeploy-linux-${GOARCH}" | grep -q 'statically linked'; then
            echo "opendeploy-linux-${GOARCH} is dynamically linked; release binaries must be static" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: opendeploy-linux-${{ matrix.arch }}
          path: backend/opendeploy-linux-${{ matrix.arch }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum opendeploy-linux-* > sha256sums.txt

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            dist/opendeploy-linux-amd64
            dist/opendeploy-linux-arm64
            dist/sha256sums.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
