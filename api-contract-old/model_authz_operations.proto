syntax = "proto3";

package opsagent.v1;

import "api-contract/model/authz.proto";

option go_package = "github.com/jptrs93/opsagent/backend/apigen";

message AuthzRuleTemplateList {
  repeated AuthzRuleTemplate items = 1;
}

message AuthzRuleTemplateCreateRequest {
  string name = 1;
  AuthzRuleTemplateSpec spec = 2;
}

message AuthzRuleTemplateUpdateRequest {
  int64 id = 1;
  string name = 2;
  AuthzRuleTemplateSpec spec = 3;
}

message AuthzRuleTemplateDeleteRequest {
  int64 id = 1;
}

message AuthzGrantCreateRequest {
  int64 user_id = 1;
  int64 template_id = 2;
  AuthzGrantSpec spec = 3;
}

message AuthzGrantDeleteRequest {
  int64 user_id = 1;
  int64 id = 2;
}

message AuthzGlobalRuleList {
  repeated AuthzGlobalRule items = 1;
}

message AuthzGlobalRuleCreateRequest {
  string name = 1;
  AuthzGlobalRuleSpec spec = 2;
}

message AuthzGlobalRuleDeleteRequest {
  int64 id = 1;
}
