syntax = "proto3";

package opsagent.v1;

import "api-contract/model/deployments.proto";
import "api-contract/options.proto";

option go_package = "github.com/jptrs93/opsagent/backend/apigen";

enum SecretKeyslotKind {
  SECRET_KEYSLOT_KIND_UNSPECIFIED = 0;
  SECRET_KEYSLOT_MACHINE = 1;   // SMK wrapped under one node's machine key
  SECRET_KEYSLOT_RECOVERY = 2;  // SMK wrapped under the Argon2id-derived recovery key
}

// Secret is one stored version. smk_version, ciphertext, and nonce are the
// sealed value and reach only the unstripped (replica) class of the event
// stream.
message Secret {
  SecretFs fs = 1;
  int32 space_id = 2;
  reserved 3;
  reserved 4, 5; // value_version, created_time: EntityMeta on the mutation
  int64 smk_version = 6;
  bytes ciphertext = 7;
  bytes nonce = 8;
  int32 id = 9;
}

// SecretKeyslot is one wrapping of the secrets master key: under a node's
// machine key or under the recovery key. Replica only.
message SecretKeyslot {
  SecretKeyslotKind kind = 1;
  int32 node_id = 2;
  int64 smk_version = 3;
  bytes wrapped_smk = 4;
  bytes nonce = 5;
  bytes kdf_salt = 6;
  int64 updated_at = 7;
}

message SecretFs {
  string name = 1;
  int32 directory_id = 2; // 0 = the implicit space root
}
