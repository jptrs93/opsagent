syntax = "proto3";

package opsagent.v1;

option go_package = "github.com/jptrs93/opsagent/backend/apigen";

message User {
  int32 id = 1;
  string name = 2;
  reserved 3; // created_at: EntityMeta on the mutation
  reserved 4; // last_login_at: the newest user session's creation is the source.
  bytes credentials = 5; // encoded InternalUser; replica class only, never sent to a browser
}

message WebAuthnCredential {
  bytes id = 1;
  bytes data = 2;
}

message InternalUser {
  int32 id = 1;
  bytes web_auth_n_id = 2;
  string name = 3;
  repeated WebAuthnCredential credentials = 4;
  bool delegated = 5; // Transient: set during request verification for agent-session tokens.
  reserved 6; // password_hash: per-user passwords, replaced by master-password login before any release depended on it.
}
