syntax = "proto3";

package opsagent.v1;

import "api-contract/model/deployments.proto";
import "api-contract/options.proto";

option go_package = "github.com/jptrs93/opsagent/backend/apigen";

message Asset {
  AssetFs fs = 1;
  int32 space_id = 2;
  string sha256 = 3;
  int64 size_bytes = 4;
  string storage_key = 5;  // physical name of the content: LargeAssetsDir/<key> locally, <s3-path>/<key> in S3
  reserved 6, 7;           // value_version, created_time: EntityMeta on the mutation
  int32 id = 8;
}

message AssetFs {
  string key = 1;
  int32 directory_id = 2; // 0 = the implicit space root
}

message AssetDirectory {
  int32 id = 1;
  int32 space_id = 2;
  string key = 3;
  int32 parent_id = 4;     // 0 = the implicit root
  reserved 5, 6;           // created_at, author: EntityMeta on the mutation
  reserved 7;              // deleted: a delete mutation on the event stream
}
