syntax = "proto3";

package opsagent.v1;

import "api-contract/options.proto";
import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/jptrs93/opsagent/backend/apigen";

message MetricsQueryRequest {
  uint64 deployment_id = 1 [(cp.js_type) = "number"];
  uint64 target_node_id = 2 [(cp.js_type) = "number"];         // Internal: set by the primary when fanning out to one node.
  uint64 scheduled_instance_id = 3 [(cp.js_type) = "number"];  // 0 = all instances.
  uint32 deployment_version = 4;     // Deployment version; 0 = all versions.
  int32 run = 5;                    // 0 = all runs.
  optional int64 time_start = 6 [(cp.go_type) = "time.Time", (cp.js_type) = "Date"];  // Inclusive; absent = time_end - 1h.
  optional int64 time_end = 7 [(cp.go_type) = "time.Time", (cp.js_type) = "Date"];    // Exclusive; absent = now.
  int64 step_ms = 8 [(cp.js_type) = "number"];                // Bucket width; 0 = server picks for ~300 points. Minimum 30000.
  repeated string fields = 9;       // Metric names to return; empty = all.
  string request_id = 10;           // Internal: correlates cluster round trips.
}

message MetricsSeries {
  uint64 scheduled_instance_id = 1 [(cp.js_type) = "number"];
  int32 ordinal = 2;
  uint32 deployment_version = 3;
  int32 run = 4;
  uint64 node_id = 5 [(cp.js_type) = "number"];
  string field = 6;
  int32 kind = 7;                   // 0 = counter (values are per-second rates), 1 = gauge (bucket mean), 2 = kernel average (bucket mean), 3 = held (the last reading, carried forward). A held series belongs to the deployment on the node: scheduled_instance_id, ordinal, deployment_version and run are 0.
  repeated double values = 8;       // One per bucket, oldest first; NaN = no data in the bucket.
}

message MetricsQueryResponse {
  int64 time_start = 1 [(cp.go_type) = "time.Time", (cp.js_type) = "Date"];  // Left edge of the first bucket.
  int64 step_ms = 2 [(cp.js_type) = "number"];
  int32 buckets = 3;
  repeated MetricsSeries series = 4;
  int64 scanned_rows = 5 [(cp.js_type) = "number"];
  int32 took_ms = 6;
  repeated string warnings = 7;
}

message MetricsLatestRequest {
  string request_id = 1;            // Internal: correlates cluster round trips.
}

message MetricsRate {
  string field = 1;
  double per_second = 2;
}

message MetricsLatestEntry {
  MetricsSample sample = 1 [(cp.go_value) = true];
  repeated MetricsRate rates = 2;   // Counter fields differenced against the previous sample of the same run.
}

// MetricsVolumeUsage is the last measured size of one deployment's volume
// directory on one node.
message MetricsVolumeUsage {
  uint64 deployment_id = 1 [(cp.js_type) = "number"];
  uint64 node_id = 2 [(cp.js_type) = "number"];
  int64 time = 3 [(cp.js_type) = "number"];     // When the reading was taken, in Unix milliseconds.
  int64 bytes = 4 [(cp.js_type) = "number"];    // Allocated bytes, as du reports them.
  int64 inodes = 5 [(cp.js_type) = "number"];   // Files, directories and links, counting the volume directory itself.
  int32 walk_ms = 6;                            // How long the measurement took.
}

message MetricsLatestResponse {
  repeated MetricsLatestEntry entries = 1;
  repeated string warnings = 2;
  repeated MetricsVolumeUsage volumes = 3;      // One per volume directory on each node that answered, whether or not the deployment is running.
}

message NodeMetricsQueryRequest {
  uint64 node_id = 1 [(cp.js_type) = "number"];
  optional int64 time_start = 2 [(cp.go_type) = "time.Time", (cp.js_type) = "Date"];  // Inclusive; absent = time_end - 1h.
  optional int64 time_end = 3 [(cp.go_type) = "time.Time", (cp.js_type) = "Date"];    // Exclusive; absent = now.
  int64 step_ms = 4 [(cp.js_type) = "number"];                // Bucket width; 0 = server picks for ~300 points.
  repeated string fields = 5;       // Metric names to return; empty = all.
  string request_id = 6;            // Internal: correlates cluster round trips.
}

message NodeMetricsSeries {
  uint64 node_id = 1 [(cp.js_type) = "number"];
  string field = 2;
  int32 kind = 3;                   // 0 = counter (values are per-second rates), 1 = gauge (bucket mean), 2 = kernel average (bucket mean).
  repeated double values = 4;       // One per bucket, oldest first; NaN = no data in the bucket.
}

message NodeMetricsQueryResponse {
  int64 time_start = 1 [(cp.go_type) = "time.Time", (cp.js_type) = "Date"];  // Left edge of the first bucket.
  int64 step_ms = 2 [(cp.js_type) = "number"];
  int32 buckets = 3;
  repeated NodeMetricsSeries series = 4;
  int64 scanned_rows = 5 [(cp.js_type) = "number"];
  int32 took_ms = 6;
  repeated string warnings = 7;
}

message NodeMetricsLatestRequest {
  string request_id = 1;            // Internal: correlates cluster round trips.
}

message NodeMetricsLatestEntry {
  NodeMetricsSample sample = 1 [(cp.go_value) = true];
  repeated MetricsRate rates = 2;   // Counter fields differenced against the node's previous sample.
}

message NodeMetricsLatestResponse {
  repeated NodeMetricsLatestEntry entries = 1;  // One per node that answered.
  repeated string warnings = 2;
}
