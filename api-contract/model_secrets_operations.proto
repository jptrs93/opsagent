syntax = "proto3";

package opsagent.v1;

import "api-contract/options.proto";
import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/jptrs93/opsagent/backend/apigen";

message SecretCreateRequest {
  string key = 1;
  bytes value = 2;                        // plaintext; encrypted at rest, never returned
  uint64 space_id = 3 [(cp.js_type) = "number"];
  optional uint64 value_directory_id = 4 [(cp.js_type) = "number"]; // absent = the space root
}

// SecretSetRequest appends the next version of an existing secret.
message SecretSetRequest {
  uint64 secret_id = 1 [(cp.js_type) = "number"];
  bytes value = 2;
  bool update_referencing_deployments = 3;
  repeated DeploymentExpectedSeq referencing_deployments = 4;
}

// SecretPasswordSpec asks for a random character string. Symbols default to
// off: the caller cannot read the value back to debug a quoting problem.
message SecretPasswordSpec {
  int32 length = 1;          // 0 = 32; accepted range is 16..4096
  bool include_symbols = 2;
}

// SecretGenerateRequest creates a secret whose value the caller never sees.
// Future generators become further alternatives of the spec.
message SecretGenerateRequest {
  string key = 1;
  uint64 space_id = 2 [(cp.js_type) = "number"];
  optional uint64 value_directory_id = 3 [(cp.js_type) = "number"];
  oneof spec {
    option (buf.validate.oneof).required = true;
    SecretPasswordSpec password = 4;
  }
}

message SecretRenameRequest {
  uint64 secret_id = 1 [(cp.js_type) = "number"];
  string new_key = 2;
}

message SecretMoveRequest {
  uint64 secret_id = 1 [(cp.js_type) = "number"];
  optional uint64 value_directory_id = 2 [(cp.js_type) = "number"]; // absent = the root of the target space
  optional uint64 space_id = 3 [(cp.js_type) = "number"];           // absent = the current space
}

message SecretDeleteRequest {
  uint64 secret_id = 1 [(cp.js_type) = "number"];
}

message SecretRevealRequest {
  uint64 secret_id = 1 [(cp.js_type) = "number"];
  uint32 version = 2; // value version; exact-version reads only
}

message SecretRevealResponse {
  bytes value = 1;
}

message SecretsStatusResponse {
  bool unlocked = 1;            // the master key is loaded
  bool recovery_configured = 2; // a recovery code has been generated
}

message SecretRecoveryCodeResponse {
  string code = 1; // shown to the operator exactly once
}

message SecretUnlockRequest {
  string code = 1;
}
