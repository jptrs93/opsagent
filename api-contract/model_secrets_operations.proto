syntax = "proto3";

package opsagent.v1;

import "api-contract/model_deployments.proto";
import "api-contract/model_secrets.proto";

option go_package = "github.com/jptrs93/opsagent/backend/apigen";

message SecretList {
  repeated Secret items = 1;
}

message SecretCreateRequest {
  string name = 1;
  bytes value = 2;         // plaintext secret value; encrypted at rest, never returned
  int32 space_id = 3;
  int32 value_directory_id = 4; // 0 = the space root; must exist in space_id
}

message SecretSetRequest {
  // Appends the next version of an existing secret. Space and name belong to
  // the secret identity and cannot be supplied here.
  int32 secret_id = 1;
  bytes value = 2;         // plaintext secret value; encrypted at rest, never returned
  bool update_referencing_deployments = 3;
  repeated DeploymentConfigVersionRef referencing_deployments = 4;
}

// SecretPasswordSpec asks for a random character string. Symbols default to
// off: a generated value is destined for a container env var or a connection
// string, and the caller cannot read it back to debug a quoting problem.
message SecretPasswordSpec {
  int32 length = 1;          // 0 => 32; accepted range is 16..4096
  bool include_symbols = 2;
}

// SecretGenerateRequest creates a secret whose value the caller never sees.
// Exactly one specification field may be set, and it selects both what to
// generate and how. Future generators — SSH keypairs, API tokens, certificates
// — become sibling fields here rather than new endpoints, so a caller that
// already knows this route needs no new instructions to reach them.
message SecretGenerateRequest {
  string name = 1;
  int32 space_id = 2;
  SecretPasswordSpec password = 3;
}

message SecretRenameRequest {
  int32 secret_id = 1;
  string new_name = 2;
}

message SecretMoveRequest {
  int32 secret_id = 1;
  int32 value_directory_id = 2; // 0 = the root of the target space
  // Target space; 0 keeps the secret where it is. See AssetMoveRequest.
  int32 space_id = 3;
}

message SecretDeleteRequest {
  int32 secret_id = 1;
}

message SecretRevealRequest {
  int32 id = 1;            // version row id — exact-version reads only
}

message SecretRevealResponse {
  bytes value = 1;         // decrypted plaintext; returned only on explicit reveal
}

message SecretsStatusResponse {
  bool unlocked = 1;            // SMK is loaded; secrets can be read/written
  bool recovery_configured = 2; // a recovery code has been generated
}

message SecretRecoveryCodeResponse {
  string code = 1;         // shown to the operator exactly once
}

message SecretUnlockRequest {
  string code = 1;         // the recovery code
}
