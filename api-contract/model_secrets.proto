syntax = "proto3";

package opsagent.v1;

import "api-contract/options.proto";

option go_package = "github.com/jptrs93/opsagent/backend/apigen";

// A secret is a stable identity (space, directory, name) whose encrypted
// content lives in immutable numbered versions. Deployment env refs and system
// settings pin secret *version* row ids; the secret id is what survives
// renames, moves, and new versions. Secrets and configs share one file system
// per space.

// SecretMeta describes a stored secret WITHOUT its value. The encrypted value
// never leaves the server. Latest version facts live in version_refs[0], never
// at the root.
message SecretMeta {
  string name = 1;
  reserved 2;
  int64 created_at = 3 [(cp.go_type) = "time.Time", (cp.js_type) = "Date"]; // secret creation time
  reserved 4, 5, 9, 11;
  reserved "updated_by", "version", "author";
  int32 id = 6;            // stable secret id
  bool deleted = 7;
  int32 space_id = 8;
  int32 value_directory_id = 10; // 0 = the implicit root directory
  // Every version, NEWEST FIRST — version_refs[0] is the latest. Deployment
  // env refs pin the row ids, so this is what usage matching and
  // version-pinned references join against.
  repeated SecretVersionMeta version_refs = 12;
}

message SecretVersionMeta {
  int32 id = 1;            // version row id — what env refs and settings pin
  int32 version = 2;       // version number
  int64 created_at = 3 [(cp.go_type) = "time.Time", (cp.js_type) = "Date"];
  int32 author = 4;    // user id that created this version; 0 = unknown/system, negative = agent of user -author
}
