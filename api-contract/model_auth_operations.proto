syntax = "proto3";

package opsagent.v1;

import "api-contract/options.proto";
import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/jptrs93/opsagent/backend/apigen";

message MasterPasswordRequest {
  string password = 1;
  string username = 2;
}

message MasterPasswordVerifyRequest {
  string password = 1;
}

message MasterPasswordSaveRequest {
  string password = 1;
}

// PasswordLoginRequest signs in with the cluster master password. The named
// user is created on first use.
message PasswordLoginRequest {
  string username = 1;
  string password = 2;
}

// AuthMethodsResponse tells the login page which methods the server accepts
// and whether a locally generated Web UI CA is served at /v1/tls/ca.crt.
message AuthMethodsResponse {
  bool passkey_login_enabled = 1;
  bool password_login_enabled = 2;
  bool local_ca_available = 3;
}

message LoginResponse {
  string token = 1;
  uint64 user_id = 2 [(cp.js_type) = "number"];
  string name = 3;
  int64 expiry = 4 [(cp.go_type) = "time.Time", (cp.js_type) = "Date"];
  string session_id = 5;
  UserSessionKind kind = 6; // FULL for agent tokens too
}

message WebAuthNOptionsResponse {
  string session_id = 1;
  bytes options_json = 2;
}

message WebAuthNFinishRequest {
  string session_id = 1;
  bytes credential_json = 2;
}
