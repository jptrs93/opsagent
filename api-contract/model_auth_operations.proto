syntax = "proto3";

package opsagent.v1;

import "api-contract/options.proto";

option go_package = "github.com/jptrs93/opsagent/backend/apigen";

message MasterPasswordRequest {
  string password = 1;
  string username = 2;
}

message MasterPasswordVerifyRequest {
  string password = 1;
}

message MasterPasswordSaveRequest {
  string password = 1;
}

// PasswordLoginRequest signs in with the cluster master password. The named
// user is created on first use, exactly as first-time setup does.
message PasswordLoginRequest {
  string username = 1;
  string password = 2;
}

// AuthMethodsResponse tells the unauthenticated login page which methods the
// server currently accepts and whether a locally generated Web UI CA can be
// downloaded from /v1/tls/ca.crt for the browser to trust.
message AuthMethodsResponse {
  bool passkey_login_enabled = 1;
  bool password_login_enabled = 2;
  bool local_ca_available = 3;
}

message LoginResponse {
  string token = 1;
  int32 user_id = 2;
  repeated string scopes = 3;
  string name = 4;
  int64 expiry = 5 [(cp.go_type) = "time.Time", (cp.js_type) = "Date"];
}

message WebAuthNOptionsResponse {
  string session_id = 1;
  bytes options_json = 2;
}

message WebAuthNFinishRequest {
  string session_id = 1;
  bytes credential_json = 2;
}
