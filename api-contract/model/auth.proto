syntax = "proto3";

package opsagent.v1;

import "api-contract/options.proto";
import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/jptrs93/opsagent/backend/apigen";

message User {
  uint64 id = 1 [(cp.js_type) = "number"];
  string name = 2 [(buf.validate.field).string.min_len = 1];
  UserAuthentication authentication = 3 [(cp.go_value) = true]; // replica class only, never sent to a browser
}

message UserAuthentication {
  bytes web_authn_id = 1;
  repeated WebAuthnCredential credentials = 2;
}

message WebAuthnCredential {
  bytes id = 1 [(buf.validate.field).bytes.min_len = 1];
  bytes data = 2 [(buf.validate.field).bytes.min_len = 1];
}
