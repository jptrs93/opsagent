syntax = "proto3";

package opsagent.v1;

option go_package = "github.com/jptrs93/opsagent/backend/apigen";

message User {
  int32 id = 1;
  string name = 2;
  int64 created_at = 3; // Unix millis;
  int64 last_login_at = 4; // Unix millis of the last completed passkey login; 0 if never.
}

message WebAuthnCredential {
  bytes id = 1;
  bytes data = 2;
}

message InternalUser {
  int32 id = 1;
  bytes web_auth_n_id = 2;
  string name = 3;
  repeated WebAuthnCredential credentials = 4;
  bool delegated = 5; // Transient: set during request verification for agent-session tokens.
}

message PublicKeyRecord {
  string kid = 1;
  bytes key_bytes = 2;
}
