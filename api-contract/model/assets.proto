syntax = "proto3";

package opsagent.v1;

import "api-contract/options.proto";

option go_package = "github.com/jptrs93/opsagent/backend/apigen";

message Asset {
  int32 id = 1;
  int64 deleted_at = 2 [(cp.go_type) = "time.Time", (cp.js_type) = "Date"]; // 0 = live
  AssetFs fs = 3;
  repeated AssetSpaceVersion space_versions = 4; // newest first
  repeated AssetContentVersion content_versions = 5; // newest first
}

message AssetFs {
  string key = 1;
  int32 directory_id = 2; // 0 = the implicit space root
}

message AssetSpaceVersion {
  int32 id = 1;
  int64 created_at = 2 [(cp.go_type) = "time.Time", (cp.js_type) = "Date"];
  int32 author = 3;   // user id; 0 = unknown/system, negative = agent of user -author
  int32 space_id = 4;
  int64 global_seq = 5;
}

message AssetContentVersion {
  int32 id = 1;       // version row id — what deployment specs pin
  int32 version = 2;
  int64 created_at = 3 [(cp.go_type) = "time.Time", (cp.js_type) = "Date"];
  int32 author = 4;   // user id; 0 = unknown/system, negative = agent of user -author
  string sha256 = 5;
  int64 size_bytes = 6;
  int64 global_seq = 7;
}

message AssetDirectory {
  int32 id = 1;
  int32 space_id = 2;
  string key = 3;
  int32 parent_id = 4;     // 0 = the implicit root
  int64 created_at = 5 [(cp.go_type) = "time.Time", (cp.js_type) = "Date"];
  int32 author = 6;        // user id that created the directory; 0 = unknown/system, negative = agent of user -author
  bool deleted = 7;        // set on the state-stream update channel when removed
}
