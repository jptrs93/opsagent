syntax = "proto3";

package opsagent.v1;

import "api-contract/options.proto";
import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/jptrs93/opsagent/backend/apigen";

enum AgentSessionStatus {
  AGENT_SESSION_STATUS_UNSPECIFIED = 0;
  AGENT_SESSION_STATUS_PENDING = 1;   // requested by an agent, awaiting operator approval
  AGENT_SESSION_STATUS_APPROVED = 2;  // approved; the token is minted on first pickup
  AGENT_SESSION_STATUS_REJECTED = 3;  // operator declined, or the request went stale
  AGENT_SESSION_STATUS_REVOKED = 4;   // was live, stopped by the operator
}

enum UserSessionKind {
  USER_SESSION_KIND_FULL = 0;       // opened by a passkey or password login
  USER_SESSION_KIND_BOOTSTRAP = 1;  // opened by master-password exchange; may only register a passkey
}

message AgentSession {
  uint64 id = 1 [(cp.js_type) = "number"];
  string session_id = 2 [(buf.validate.field).string.min_len = 1];
  uint64 user_id = 3 [(cp.js_type) = "number"];
  AgentSessionStatus status = 4 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  optional int64 approved_at = 5 [(cp.go_type) = "time.Time", (cp.js_type) = "Date"];
  string requesting_address = 6;
  optional string approval_code = 7 [(buf.validate.field).string.min_len = 1];
  AgentToken token = 8;
}

// AgentToken is the minted bearer token: the hash is replica class only and
// never sent to a browser.
message AgentToken {
  optional bytes hash = 1 [(buf.validate.field).bytes.min_len = 1];
  string prefix = 2 [(buf.validate.field).string.min_len = 1];
  int64 expires_at = 3 [(cp.go_type) = "time.Time", (cp.js_type) = "Date"];
}

message UserSession {
  uint64 id = 1 [(cp.js_type) = "number"];
  string session_id = 2 [(buf.validate.field).string.min_len = 1];
  uint64 user_id = 3 [(cp.js_type) = "number"];
  UserSessionKind kind = 4 [(buf.validate.field).enum.defined_only = true];
  int64 expires_at = 5 [(cp.go_type) = "time.Time", (cp.js_type) = "Date"];
  optional int64 revoked_at = 6 [(cp.go_type) = "time.Time", (cp.js_type) = "Date"];
  string requesting_address = 7;
  string user_agent = 8;
  optional bytes token_hash = 9 [(buf.validate.field).bytes.min_len = 1]; // absent on the browser stream
}
