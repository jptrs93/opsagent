syntax = "proto3";

package opsagent.v1;

import "api-contract/options.proto";
import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/jptrs93/opsagent/backend/apigen";

message Deployment {
  uint64 id = 1 [(cp.js_type) = "number"];
  string name = 2 [(buf.validate.field).string.min_len = 1];
  uint64 space_id = 3 [(cp.js_type) = "number"];
  DeploymentSpec spec = 4 [(cp.go_value) = true];
  Scheduling scheduling = 5 [(cp.go_value) = true];
}

message DeploymentSpec {
  Workload workload = 1 [(cp.go_value) = true];
  NetworkingConfig networking = 2 [(cp.go_value) = true];
}

message Workload {
  oneof value {
    option (buf.validate.oneof).required = true;
    ContainerSpec container = 1;
  }
}

message ContainerSpec {
  ContainerSource source = 1 [(cp.go_value) = true];
  ContainerRuntime runtime = 2 [(cp.go_value) = true];
  string version = 3;
  ContainerUpgradeStrategy upgrade_strategy = 4 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  ContainerReadinessSignal readiness_signal = 5; // required by ROLLOVER
}

message ContainerSource {
  oneof value {
    option (buf.validate.oneof).required = true;
    NixImageBuild nix_image_build = 1;
    RemoteImage remote_image = 2;
  }
}

message NixImageBuild {
  string repo = 1;
  string flake = 2;   // path to flake.nix relative to the repo root
  string target = 3;  // flake output producing a nix2container image description
}

message RemoteImage {
  string image = 1;   // image repository ref; the tag or digest is ContainerSpec.version
}

message ContainerRuntime {
  string user = 1;                         // OCI process.user; empty = image default
  map<string, EnvVar> env_vars = 2;
  repeated string override_command = 3;    // argv override; empty = image default
  string override_working_dir = 4;         // OCI process.cwd; empty = image default
  DefaultVolumeMount default_volume = 5 [(cp.go_value) = true];
  repeated CrossDeploymentMount cross_deployment_mounts = 6;
  repeated HostMount mounts = 7;
  repeated AssetMount asset_mounts = 8;
  optional uint32 dev_shm_size_kb = 9 [(buf.validate.field).uint32.gte = 1];
  optional uint32 file_descriptor_limit = 10 [(buf.validate.field).uint32.gte = 1];
  IssuedTLSMount issued_tls_mount = 11;
}

message EnvVar {
  oneof value {
    option (buf.validate.oneof).required = true;
    LiteralEnv literal = 1;
    SecretEnv secret = 2;
    ConfigEnv config = 3;
    AssetEnv asset = 4;
    AddressEnv address = 5;
  }
}

message LiteralEnv {
  string value = 1;
}

message SecretEnv {
  SecretRef secret = 1 [(cp.go_value) = true];
}

message ConfigEnv {
  ConfigRef config = 1 [(cp.go_value) = true];
}

message AssetEnv {
  string key = 1;                           // display key copied from the asset at write time
  AssetRef asset = 2 [(cp.go_value) = true];
}

// AddressEnv resolves to a virtual deployment's ordinal-zero stable inbound
// address. Both fields are set so a node derives it without deployment state.
message AddressEnv {
  uint64 deployment_id = 1 [(cp.js_type) = "number"];
  uint64 space_id = 2 [(cp.js_type) = "number"];
}

message DefaultVolumeMount {
  string container_path = 1;
  bool disabled = 2;
}

message CrossDeploymentMount {
  uint64 deployment_id = 1 [(cp.js_type) = "number"];
  string container_path = 2;
  FilePermission permission = 3 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
}

message HostMount {
  string host_path = 1;      // must already exist on the node
  string container_path = 2;
  FilePermission permission = 3 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
}

message AssetMount {
  AssetRef asset = 1 [(cp.go_value) = true];
  string container_path = 2;
  FilePermission permission = 3 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
}

message IssuedTLSMount {
  string container_path = 1;
  repeated string extra_names = 2;
  bool ca_only = 3;          // mount only the workload CA certificate
}

enum ContainerUpgradeStrategy {
  CONTAINER_UPGRADE_STRATEGY_UNSPECIFIED = 0;
  CONTAINER_UPGRADE_STRATEGY_RECREATE = 1;
  CONTAINER_UPGRADE_STRATEGY_ROLLOVER = 2;
}

message ContainerReadinessSignal {
  optional uint32 timeout_seconds = 1 [(buf.validate.field).uint32.gte = 1]; // absent = default timeout
}

message NetworkingConfig {
  NetworkingMode mode = 1 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  repeated PortForward port_forwarding = 2; // virtual mode only
  repeated Ingress ingress = 3;             // virtual mode only
}

enum NetworkingMode {
  NETWORKING_MODE_UNSPECIFIED = 0;
  NETWORKING_MODE_VIRTUAL = 1;  // per-container netns on the virtual IPv6 network
  NETWORKING_MODE_HOST = 2;     // host network namespace
}

message PortForward {
  PortForwardProtocol protocol = 1 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  uint32 host_port = 2 [(buf.validate.field).uint32 = {gte: 1, lte: 65535}];
  uint32 container_port = 3 [(buf.validate.field).uint32 = {gte: 1, lte: 65535}];
  repeated IpFilter ip_filter = 4;
}

enum PortForwardProtocol {
  PORT_FORWARD_PROTOCOL_UNSPECIFIED = 0;
  PORT_FORWARD_PROTOCOL_TCP = 1;
  PORT_FORWARD_PROTOCOL_UDP = 2;
}

message IpFilter {
  IpFilterMode mode = 1 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  IpPrefix prefix = 2 [(cp.go_value) = true];
}

enum IpFilterMode {
  IP_FILTER_MODE_UNSPECIFIED = 0;
  IP_FILTER_MODE_ALLOW = 1;
  IP_FILTER_MODE_DENY = 2;
}

// Ingress is a public route declared by a workload. listen says where it is
// published; empty publishes on every host address of the scheduled node.
message Ingress {
  string hostname = 1;
  repeated IngressListen listen = 2;
  IngressConfig config = 3 [(cp.go_value) = true];
}

// IngressListen selects (node, host address) pairs. An absent node means the
// scheduled node; an empty address list means every address of any family.
message IngressListen {
  IngressNode node = 1;
  repeated IpPrefix addresses = 2;
}

message IngressNode {
  oneof value {
    option (buf.validate.oneof).required = true;
    AnyNode any = 1;
    SpecificNode specific = 2;
  }
}

message AnyNode {}

message SpecificNode {
  uint64 node_id = 1 [(cp.js_type) = "number"];
}

message IngressConfig {
  oneof value {
    option (buf.validate.oneof).required = true;
    TlsPassthroughConfig tls_passthrough = 1;
    HttpsConfig https = 2;
  }
}

// TlsPassthroughConfig forwards a TLS connection by SNI without terminating
// it. An absent host_port is 443.
message TlsPassthroughConfig {
  optional uint32 host_port = 1 [(buf.validate.field).uint32 = {gte: 1, lte: 65535}];
  uint32 container_port = 2 [(buf.validate.field).uint32 = {gte: 1, lte: 65535}];
}

message HttpsConfig {
  uint32 container_port = 1 [(buf.validate.field).uint32 = {gte: 1, lte: 65535}];
  string path_prefix = 2;
  bool strip_prefix = 3;
  HttpBackendProtocol backend_protocol = 4 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  optional uint64 max_request_body_bytes = 5 [(cp.js_type) = "number", (buf.validate.field).uint64.gte = 1];
  optional uint32 flush_interval_ms = 6 [(buf.validate.field).uint32.gte = 1];
  CertSource cert_source = 7;
}

enum HttpBackendProtocol {
  HTTP_BACKEND_PROTOCOL_UNSPECIFIED = 0;
  HTTP_BACKEND_PROTOCOL_H2C = 1;
  HTTP_BACKEND_PROTOCOL_HTTP1 = 2;
}

message CertSource {
  oneof value {
    option (buf.validate.oneof).required = true;
    AcmeCertSource acme = 1;
    SecretCertSource secret = 2;
  }
}

message AcmeCertSource {
  AcmeChallenge challenge = 1 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
}

message SecretCertSource {
  SecretRef secret = 1 [(cp.go_value) = true];
}

enum AcmeChallenge {
  ACME_CHALLENGE_UNSPECIFIED = 0;
  ACME_CHALLENGE_HTTP_01 = 1;
}

// Scheduling is where and whether a deployment runs. restart_generation
// counts operator restarts: a restart is a write that bumps it and changes
// nothing else.
message Scheduling {
  bool running = 1;
  Placement placement = 2 [(cp.go_value) = true];
  uint32 restart_generation = 3;
}

message Placement {
  oneof value {
    option (buf.validate.oneof).required = true;
    DedicatedNodesScheduling dedicated_nodes = 1;
  }
}

// DedicatedNodesScheduling runs one instance on each hand-picked node. One
// node is accepted until multi-node deployments land.
message DedicatedNodesScheduling {
  repeated uint64 nodes = 1 [(cp.js_type) = "number", (buf.validate.field).repeated = {min_items: 1, max_items: 1}];
}

// DeploymentExpectedSeq names a deployment and the seq of its last mutation
// the caller saw. The server rejects the write when a newer mutation exists;
// expected_seq = 0 skips the check.
message DeploymentExpectedSeq {
  uint64 deployment_id = 1 [(cp.js_type) = "number"];
  int64 expected_seq = 2 [(cp.js_type) = "number"];
}
