syntax = "proto3";

package opsagent.v1;

import "api-contract/options.proto";

option go_package = "github.com/jptrs93/opsagent/backend/apigen";

message ConfigEvent {
  int32 config_id = 1;
  int32 version = 2;
  int64 seq = 3;
  int64 event_id = 4;
  int32 author = 5;
  EventType event_type = 6;
  int64 created_time = 7;
  int64 event_time = 8;
  int32 value_version = 9;
  int32 space_version = 10;
  Config value = 11 [(cp.go_value) = true];
}

message Config {
  ConfigFs fs = 1;
  int32 space_id = 2;
  string value = 3;
}

message ConfigFs {
  string name = 1;
  int32 directory_id = 2; // 0 = the implicit space root
}

message ValueDirectory {
  int32 id = 1;
  int32 space_id = 2;
  string name = 3;
  int32 parent_id = 4;     // 0 = the implicit root
  int64 created_at = 5 [(cp.go_type) = "time.Time", (cp.js_type) = "Date"];
  int32 author = 6;        // user id that created the directory; 0 = unknown/system, negative = agent of user -author
  bool deleted = 7;        // set on the state-stream update channel when removed
}
