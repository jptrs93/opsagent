syntax = "proto3";

package opsagent.v1;

option go_package = "github.com/jptrs93/opsagent/backend/apigen";

message RawLogLine {
  int64 time = 1;              // Unix nanoseconds.
  int32 version = 2;           // Deployment config version.
  int32 run = 3;               // Run/restart number.
  int32 stream = 4;            // 0 = stdout, 1 = stderr.
  bytes line = 5;              // Raw log line bytes.
  int32 deployment = 6;        // Producing deployment; not yet wired.
  int32 node = 7;              // Producing node; not yet wired.
  int32 instance_ordinal = 8;  // Producing instance; not yet wired.
}

message LogLineBatch {
  repeated RawLogLine lines = 1;
  string log_dir = 2;  // Absolute worker path to this deployment's run log directory.
}

message StructuredLogLine {
   int64 time = 1;  // Unix nanoseconds.
   int32 source_deployment_id = 2;
   int32 source_deployment_version_id = 3;
   int32 source_run_number = 4;
   int32 source_instance_ordinal = 5;
   int32 source_node = 6;
   int32 source_stream = 7;   // 0 = stdout, 1 = stderr.
   map<string, int64> int_fields = 8;
   map<string, double> float_fields = 9;
   map<string, bool> bool_fields = 10;
   map<string, string> str_fields = 11;
}