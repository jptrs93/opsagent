syntax = "proto3";

package opsagent.v1;

import "api-contract/options.proto";
import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/jptrs93/opsagent/backend/apigen";

enum RunningStatus {
  RUNNING_STATUS_UNSPECIFIED = 0;
  RUNNING_STATUS_NO_DEPLOYMENT = 1;
  RUNNING_STATUS_RUNNING = 2;
  RUNNING_STATUS_STOPPED = 3;
  RUNNING_STATUS_STARTING = 4;
  RUNNING_STATUS_CRASHED = 5;
}

// PreparationStatus is the rollup across both preparation stages and gates
// runner start. It is derived from InputsStatus and ImageStatus by
// PreparerStatus.Rollup() and never stored or sent.
enum PreparationStatus {
  PREPARATION_STATUS_UNSPECIFIED = 0;
  PREPARATION_STATUS_PREPARING = 1;
  PREPARATION_STATUS_DOWNLOADING = 2;
  PREPARATION_STATUS_READY = 3;
  PREPARATION_STATUS_FAILED = 4;
  PREPARATION_STATUS_PULLING = 5;
}

// InputsStatus is stage 1: resolving the assets, secrets, and configs the
// workload needs at spawn.
enum InputsStatus {
  INPUTS_STATUS_UNSPECIFIED = 0;
  INPUTS_STATUS_RESOLVING = 1;
  INPUTS_STATUS_READY = 2;
  INPUTS_STATUS_FAILED = 3;
}

// ImageStatus is stage 2: producing the runtime artifact. The self-deployment
// reaches DOWNLOADING and READY for an executable rather than an image.
enum ImageStatus {
  IMAGE_STATUS_UNSPECIFIED = 0;
  IMAGE_STATUS_BUILDING = 1;
  IMAGE_STATUS_PULLING = 2;
  IMAGE_STATUS_DOWNLOADING = 3;
  IMAGE_STATUS_READY = 4;
  IMAGE_STATUS_FAILED = 5;
}

// ScheduledInstanceTarget is the primary-controlled desired state of one
// placement. The three RUN_* states are identical to the node: all three mean
// run this placement. They differ only in what the network state derives from
// them. Exactly one placement per (deployment, ordinal) is RUN_SERVING.
enum ScheduledInstanceTarget {
  SCHEDULED_INSTANCE_TARGET_RUN_SERVING = 0;
  SCHEDULED_INSTANCE_TARGET_TERMINATE = 1;
  SCHEDULED_INSTANCE_TARGET_FINALIZED = 2;
  SCHEDULED_INSTANCE_TARGET_RUN_STANDBY = 3;
  SCHEDULED_INSTANCE_TARGET_RUN_DRAINING = 4;
}

// ScheduledInstance is one placement of a deployment ordinal on a node,
// pinned to one deployment version.
message ScheduledInstance {
  uint64 id = 1 [(cp.js_type) = "number"];
  uint64 node_id = 2 [(cp.js_type) = "number"];
  uint32 instance_ordinal = 3;
  ScheduledInstanceTarget state = 4 [(buf.validate.field).enum.defined_only = true];
  uint64 space_id = 5 [(cp.js_type) = "number"];
  DeploymentRef deployment = 6 [(cp.go_value) = true];
}

message DeploymentRef {
  uint64 deployment_id = 1 [(cp.js_type) = "number"];
  uint32 version = 2 [(buf.validate.field).uint32.gte = 1];
}

// ScheduledInstanceStatus is the newest observation of one placement.
// updated_at is an HLC assigned by the owning node: max(now, prev + 1ns).
// A half that nothing has reported yet is absent.
message ScheduledInstanceStatus {
  uint64 scheduled_instance_id = 1 [(cp.js_type) = "number"];
  google.protobuf.Timestamp updated_at = 2 [(buf.validate.field).required = true];
  PreparerStatus preparer = 3;
  RunnerStatus runner = 4;
}

message PreparerStatus {
  uint32 deployment_spec_version = 1;
  string artifact = 2;
  InputsStatus inputs = 3 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  optional ImageStatus image = 4 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
}

message RunnerStatus {
  uint32 deployment_spec_version = 1;
  optional uint32 running_pid = 2 [(buf.validate.field).uint32.gte = 1];
  string running_artifact = 3;
  RunningStatus status = 4 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  uint32 number_of_restarts = 5;
  optional int64 last_restart_at = 6 [(cp.go_type) = "time.Time", (cp.js_type) = "Date"];
  repeated string network_diagnostics = 7;
  optional int32 exit_code = 8;
}
