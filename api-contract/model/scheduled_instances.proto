syntax = "proto3";

package opsagent.v1;

import "api-contract/model/deployments.proto";
import "api-contract/options.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/jptrs93/opsagent/backend/apigen";

enum RunningStatus {
  DEPLOYMENT_STATUS_UNKNOWN = 0;
  NO_DEPLOYMENT = 1;
  RUNNING = 2;
  STOPPED = 3;
  STARTING = 4;
  CRASHED = 5;
}

// PreparationStatus is the rollup across both preparation stages, and is what
// gates runner start. It is derived from InputsStatus and ImageStatus rather
// than stored or sent: see PreparerStatus.Rollup(). Nothing persists it, so the
// stages can never disagree with it.
enum PreparationStatus {
  PREPARATION_STATUS_UNKNOWN = 0;
  PREPARING = 2;
  DOWNLOADING = 3;
  READY = 4;
  FAILED = 5;
  PULLING = 6; // pulling a container image into the content store
}

// InputsStatus tracks stage 1: resolving the assets, secrets, and configs the
// workload needs at spawn. Independent of the artifact, and retried on its own
// once the artifact is already recorded.
enum InputsStatus {
  INPUTS_STATUS_UNKNOWN = 0;
  INPUTS_RESOLVING = 1;
  INPUTS_READY = 2;
  INPUTS_FAILED = 3;
}

// ImageStatus tracks stage 2: producing the runtime artifact. Named for the
// public case, where the artifact is always a local containerd image. The
// internal OpenDeploy self-deployment reaches IMAGE_DOWNLOADING/IMAGE_READY for
// an executable rather than an image; that path is redacted from public
// responses.
enum ImageStatus {
  IMAGE_STATUS_UNKNOWN = 0;
  IMAGE_BUILDING = 1;     // nix build
  IMAGE_PULLING = 2;      // pulling a remote image into the content store
  IMAGE_DOWNLOADING = 3;  // internal: downloading a GitHub release artifact
  IMAGE_READY = 4;
  IMAGE_FAILED = 5;
}

// ScheduledInstanceTarget is the primary-controlled desired runtime state for
// one scheduled instance assignment.
//
// The three RUN_* states are identical to the node's operator: all three mean
// "run this placement". They differ only in what the network state derives from
// them, which is what lets cross-node routing be a pure function of assignments
// with no status input. Exactly one placement per (deployment, ordinal) is
// RUN_SERVING at a time, and it is the one the instance's stable inbound
// address routes to.
enum ScheduledInstanceTarget {
  SCHEDULED_INSTANCE_TARGET_RUN_SERVING = 0;  // running and owns the inbound address
  SCHEDULED_INSTANCE_TARGET_TERMINATE = 1;    // node should terminate
  SCHEDULED_INSTANCE_TARGET_FINALIZED = 2;    // termination acknowledged; leave snapshot
  SCHEDULED_INSTANCE_TARGET_RUN_STANDBY = 3;  // warming replacement, not yet serving
  SCHEDULED_INSTANCE_TARGET_RUN_DRAINING = 4; // superseded but still running
}

// ScheduledInstance is one placement/runtime incarnation of a deployment
// instance ordinal on a node, pinned to a specific deployment config version.
message ScheduledInstance {
  int32 id = 1;
  int64 created_at = 2 [(cp.go_type) = "time.Time", (cp.js_type) = "Date"];
  int32 deployment_id = 3;
  int32 deployment_version = 4;
  int32 node_id = 5;
  int32 instance_ordinal = 6;
  ScheduledInstanceTarget state = 7;
  int32 space_id = 8;
}

message ScheduledInstanceStatus {
  // updated_at is an HLC assigned by the owning node: max(wall_clock_now, prev+1ns). Monotonic per scheduled instance, so it doubles as wall-clock time and identity/ordering key.
  google.protobuf.Timestamp updated_at = 1;
  int32 scheduled_instance_id = 2;
  int32 deployment_id = 3;
  PreparerStatus preparer = 4 [(cp.go_value) = true];
  RunnerStatus runner = 5 [(cp.go_value) = true];
}

// ScheduledInstanceState is the authoritative runtime assignment view: the
// schedule row, the immutable deployment config version it references, and the
// latest observed status for that instance.
message ScheduledInstanceState {
  ScheduledInstance instance = 1 [(cp.go_value) = true];
  DeploymentConfig config = 2 [(cp.go_value) = true];
  ScheduledInstanceStatus status = 3 [(cp.go_value) = true];
}

message ScheduledInstanceSnapshot {
  repeated ScheduledInstanceState items = 1;
}

// Preparation runs in two stages. The rollup that gates runner start is derived
// from the pair via Rollup(); field 3 held it before it became derived and must
// not be reused.
message PreparerStatus {
  int32 deployment_config_version = 1;
  string artifact = 2;
  reserved 3;
  InputsStatus inputs = 4;
  ImageStatus image = 5;
}

message RunnerStatus {
  // Status blobs are persisted; retired field numbers must not be reused.
  reserved 5, 9;
  int32 deployment_config_version = 1;
  int32 running_pid = 2;
  string running_artifact= 3;
  RunningStatus status = 4;
  int32 number_of_restarts = 6;
  int64 last_restart_at = 7 [(cp.go_type) = "time.Time", (cp.js_type) = "Date"];
  string running_version = 8;
  // Networking diagnostics surfaced on the status card (e.g. an IPv4-only listener that is unreachable at its instance address).
  repeated string network_diagnostics = 10;
}
