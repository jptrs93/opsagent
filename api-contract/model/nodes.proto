syntax = "proto3";

package opsagent.v1;

import "api-contract/options.proto";

option go_package = "github.com/jptrs93/opsagent/backend/apigen";

enum NodeLifecycleStatus {
  NODE_STATUS_UNKNOWN = 0;
  NODE_ENROLLMENT_REQUESTED = 1;
  NODE_ENROLLMENT_CANCELLED = 2;
  NODE_ENROLLMENT_REQUEST_EXPIRED = 3;
  NODE_MEMBER_NORMAL = 4;
  NODE_MEMBER_UNHEALTHY = 5;
  NODE_MEMBER_DRAINING = 6;
  NODE_MEMBER_MISSING = 7;
  NODE_MEMBER_EVICTED = 8;
}

message NodeReported {
  string identifier = 1;
  string underlay_address = 2;
  string wg_public_key = 3;
  repeated string host_addresses = 4;
  // A failed inventory leaves the primary's last known addresses unchanged.
  bool host_addresses_unknown = 5;
}

message NodeOperator {
  string name = 1;
  repeated int32 roles = 2;
  repeated int32 allowed_spaces = 3;
  int64 enrolled_time = 4;
}

message Node {
  NodeLifecycleStatus status = 1;
  int64 enrollment_requested_at = 2;
  NodeOperator operator = 3 [(cp.go_value) = true];
  NodeReported reported = 4 [(cp.go_value) = true];
}

message NodeEvent {
  int32 node_id = 1;
  int32 version = 2;
  int64 seq = 3;
  int64 event_id = 4;
  int32 author = 5;
  EventType event_type = 6;
  int64 created_time = 7;
  int64 event_time = 8;
  Node value = 9 [(cp.go_value) = true];
}

message NodeStatus {
  int32 node_id = 1;
  google.protobuf.Timestamp updated_at = 2;
  bool is_connected = 3;
  int64 last_connected_at = 4 [(cp.go_type) = "time.Time", (cp.js_type) = "Date"];
  string remote_address = 5;
  string opendeploy_version = 6;
  string runtime_versions = 7;
}

message EnrollmentRequestStatus {
  int32 id = 1;
  int64 created_at = 2 [(cp.go_type) = "time.Time", (cp.js_type) = "Date"];
  string requesting_ip_address = 4;
  string requesting_machine_id = 5;
  string opendeploy_version = 7;
  string underlay_address = 8;
  NodeLifecycleStatus status = 9;
  bool is_connected = 10;
}

message NodeEnrollmentInfo {
  string enrollment_tls_spki_sha256 = 1;
}
