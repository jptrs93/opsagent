syntax = "proto3";

package opsagent.v1;

import "api-contract/options.proto";
import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/jptrs93/opsagent/backend/apigen";

// Secret is one stored version. sealed reaches only the replica class of the
// event stream.
message Secret {
  uint64 id = 1 [(cp.js_type) = "number"];
  SecretFs fs = 2 [(cp.go_value) = true];
  uint64 space_id = 3 [(cp.js_type) = "number"];
  SealedSecret sealed = 4; // absent on the browser stream
}

message SecretFs {
  string key = 1 [(buf.validate.field).string = {min_len: 1, max_len: 255}];
  optional uint64 directory_id = 2 [(cp.js_type) = "number"]; // absent = the space root
}

message SealedSecret {
  uint32 smk_version = 1 [(buf.validate.field).uint32.gte = 1];
  bytes ciphertext = 2 [(buf.validate.field).bytes.min_len = 1];
  bytes nonce = 3 [(buf.validate.field).bytes.min_len = 1];
}

// SecretKeyslot is one wrapping of the secrets master key. Replica only.
message SecretKeyslot {
  uint64 id = 1 [(cp.js_type) = "number"];
  uint32 smk_version = 2 [(buf.validate.field).uint32.gte = 1];
  bytes wrapped_smk = 3 [(buf.validate.field).bytes.min_len = 1];
  bytes nonce = 4 [(buf.validate.field).bytes.min_len = 1];
  KeyslotWrapping wrapping = 5 [(cp.go_value) = true];
}

message KeyslotWrapping {
  oneof value {
    option (buf.validate.oneof).required = true;
    MachineKey machine_key = 1;    // wrapped under one node's machine key for unattended boot
    RecoveryCode recovery_code = 2; // wrapped under the Argon2id key derived from the recovery code
  }
}

message MachineKey {
  uint64 node_id = 1 [(cp.js_type) = "number"];
}

message RecoveryCode {
  bytes kdf_salt = 1 [(buf.validate.field).bytes.min_len = 1];
}
