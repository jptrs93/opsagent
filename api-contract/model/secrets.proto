syntax = "proto3";

package opsagent.v1;

import "api-contract/options.proto";

option go_package = "github.com/jptrs93/opsagent/backend/apigen";

message SecretEvent {
  int32 secret_id = 1;
  int32 version = 2;
  int64 seq = 3;
  int64 event_id = 4;
  int32 author = 5;
  EventType event_type = 6;
  int64 created_time = 7;
  int64 event_time = 8;
  int32 value_version = 9;
  int32 space_version = 10;
  Secret value = 11 [(cp.go_value) = true];
}

message Secret {
  SecretFs fs = 1;
  int32 space_id = 2;
}

message SecretFs {
  string name = 1;
  int32 directory_id = 2; // 0 = the implicit space root
}
