syntax = "proto3";

package opsagent.v1;

import "api-contract/options.proto";

option go_package = "github.com/jptrs93/opsagent/backend/apigen";

message Secret {
  int32 id = 1;
  int64 deleted_at = 2 [(cp.go_type) = "time.Time", (cp.js_type) = "Date"]; // 0 = live
  SecretFs fs = 3;
  repeated SecretSpaceVersion space_versions = 4; // newest first
  repeated SecretVersion versions = 5; // newest first
}

message SecretFs {
  string name = 1;
  int32 directory_id = 2; // 0 = the implicit space root
}

message SecretSpaceVersion {
  int32 id = 1;
  int64 created_at = 2 [(cp.go_type) = "time.Time", (cp.js_type) = "Date"];
  int32 author = 3;   // user id; 0 = unknown/system, negative = agent of user -author
  int32 space_id = 4;
  int64 global_seq = 5;
}

message SecretVersion {
  int32 id = 1;       // version row id — what env refs and settings pin
  int32 version = 2;
  int64 created_at = 3 [(cp.go_type) = "time.Time", (cp.js_type) = "Date"];
  int32 author = 4;   // user id; 0 = unknown/system, negative = agent of user -author
  int64 global_seq = 5;
}
