syntax = "proto3";

package opsagent.v1;

import "api-contract/options.proto";
import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/jptrs93/opsagent/backend/apigen";

message BackupStatus {
  bool configured = 1;
  bool running = 2;
  bool in_sync = 3;
  uint64 local_txid = 4 [(cp.js_type) = "number"];
  uint64 remote_txid = 5 [(cp.js_type) = "number"];
  optional int64 last_successful_sync_at = 6 [(cp.go_type) = "time.Time", (cp.js_type) = "Date"];
  string error = 7;
  uint32 asset_pending = 8;
  bool asset_target_s3 = 9;
  string asset_error = 10;
  bool asset_keep_local = 11;
}
