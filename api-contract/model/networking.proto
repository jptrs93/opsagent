syntax = "proto3";

package opsagent.v1;

import "api-contract/options.proto";
import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/jptrs93/opsagent/backend/apigen";

message AcmeState {
  int64 seq = 1 [(cp.js_type) = "number"];
  repeated AcmeCertBinding cert_bindings = 2;
  repeated AcmeHttpChallenge challenges = 3;
}

message AcmeCertBinding {
  string hostname = 1;
  SecretRef secret = 2 [(cp.go_value) = true];
}

// ClusterNetworkInfo carries the cluster-wide virtual network parameters.
// Every address is a pure function of the ULA prefix, space, deployment,
// ordinal, version, and run, so this is the only distributed IPAM state.
message ClusterNetworkInfo {
  bytes ula_prefix = 1 [(buf.validate.field).bytes.len = 6];
}

// ClusterNetMap is a complete placement and underlay snapshot targeted to one
// node. derived_from_seq is the primary's write seq at render time; the first
// map accepted in a session replaces the node's cache, later ones must carry
// a higher stamp.
message ClusterNetMap {
  uint64 target_node_id = 1 [(cp.js_type) = "number"];
  bytes ula_prefix = 2;
  repeated ClusterNetMapNode nodes = 3;
  repeated ClusterNetMapRoute routes = 4;
  int64 derived_from_seq = 5 [(cp.js_type) = "number"];
  repeated NetPolicyRule policy_rules = 6;
  repeated ClusterNetMapService dns_services = 7;
}

message ClusterNetMapService {
  string name = 1;
  uint64 space_id = 2 [(cp.js_type) = "number"];
  uint64 deployment_id = 3 [(cp.js_type) = "number"];
  repeated ClusterNetMapServiceOrdinal ordinals = 4;
}

message ClusterNetMapServiceOrdinal {
  uint32 ordinal = 1;
}

// NetPolicyRule is one allow rule rendered from the policy table: the source
// peer may initiate connections toward the destination peer.
message NetPolicyRule {
  NetPolicyPeer source = 1 [(cp.go_value) = true];
  NetPolicyPeer destination = 2 [(cp.go_value) = true];
  repeated NetPortMatch ports = 3; // empty = all ports and protocols
}

message NetPolicyPeer {
  uint64 space_id = 1 [(cp.js_type) = "number"];
  uint64 deployment_id = 2 [(cp.js_type) = "number"]; // 0 = the whole space
}

message ClusterNetMapNode {
  uint64 node_id = 1 [(cp.js_type) = "number"];
  string underlay_address = 2;
  string wg_public_key = 3;  // base64 Curve25519 key; WireGuard is the only cross-node transport
  uint32 wg_listen_port = 4;
  repeated IngressPublish ingress_publish = 5; // the node's DNAT set from the routes' listen selectors
}

// IngressPublish is one (host address, TCP port) the node forwards to its
// netproxy. An empty address publishes on every local address.
message IngressPublish {
  string address = 1;
  uint32 port = 2;
}

// IngressDiagnostic is a non-fatal finding from ingress evaluation about one
// deployment: an excluded claim, a collision resolved against it, or a
// host-mode deployment on a published node.
message IngressDiagnostic {
  uint64 deployment_id = 1 [(cp.js_type) = "number"];
  string message = 2;
}

message IngressDiagnosticList {
  repeated IngressDiagnostic items = 1;
}

// ClusterNetMapRoute points one routed prefix at the node hosting it: the /100
// of a (deployment, ordinal) instance or the /120 of one scheduled instance.
message ClusterNetMapRoute {
  string logical_prefix = 1;
  uint64 hosting_node_id = 2 [(cp.js_type) = "number"];
}

// NetMapStatus reports durable acceptance separately from kernel application.
// Both fields carry a map's derived_from_seq stamp.
message NetMapStatus {
  int64 persisted_seq = 1 [(cp.js_type) = "number"];
  int64 applied_seq = 2 [(cp.js_type) = "number"];
  string reconciliation_error = 3;
}

// NetState is the file the agent writes for the per-node dataplane
// deployment (DNS and ingress proxy). Every tag is kept: the file outlives
// an agent upgrade.
message NetState {
  int64 seq = 1 [(cp.js_type) = "number"];               // monotonic; consumers ignore snapshots with seq <= last applied
  bytes ula_prefix = 2;        // 6-byte ULA /48 prefix
  string node_identifier = 3;  // immutable identifier of the node this snapshot was rendered for
  repeated DnsService dns_services = 4;
  repeated string upstream_resolvers = 5; // host's upstream DNS servers, "ip" or "ip:port"
  repeated NetIngress ingress = 6;
  repeated AcmeHttpChallenge acme_challenges = 7;
}

message AcmeHttpChallenge {
  string token = 1;
  string key_authorization = 2;
}

// DnsService is one deployment's discovery record set:
// {name}.{environment}.internal -> established instance addresses.
message DnsService {
  string name = 1;        // normalized deployment name (underscores -> hyphens)
  string environment = 2; // normalized space name
  repeated Endpoint endpoints = 3;
}

message Endpoint {
  uint32 ordinal = 1;      // instance ordinal (0-based)
  string address = 2;     // stable inbound instance address
  reserved 3, 5;
  EndpointState state = 4;
}

enum EndpointState {
  ENDPOINT_STATE_UNSPECIFIED = 0;
  ENDPOINT_STATE_READY = 1;    // resolves in DNS, receives traffic
  ENDPOINT_STATE_DRAINING = 2; // removed from the set ahead of SIGTERM
  ENDPOINT_STATE_DOWN = 3;     // instance not running
}

// NetIngress is a node-local, rendered ingress route consumed by netproxy.
message NetIngress {
  IngressKind kind = 1;
  string hostname = 2;
  TlsPassthroughNetIngress tls_passthrough = 3;
  HttpsNetIngress https = 4;
}

enum IngressKind {
  INGRESS_KIND_UNSPECIFIED = 0;
  INGRESS_KIND_TLS_PASSTHROUGH = 1;
  INGRESS_KIND_HTTPS = 2;
}

message HttpsNetIngress {
  string path_prefix = 1;
  bool strip_prefix = 2;
  HttpBackendProtocol backend_protocol = 3;
  uint64 max_request_body_bytes = 4 [(cp.js_type) = "number"];
  uint32 flush_interval_ms = 5;
  string cert_id = 6;
  repeated IngressBackend backends = 7;
}

// CertBundle is the certificate file beside NetState. Every tag is kept.
message CertBundle {
  int64 seq = 1 [(cp.js_type) = "number"];
  repeated CertBundleEntry certs = 2;
}

message CertBundleEntry {
  string cert_id = 1;
  bytes pem = 2;
}

message TlsPassthroughNetIngress {
  uint32 host_port = 1;
  repeated IngressBackend backends = 2;
}

message IngressBackend {
  string address = 1;
  uint32 port = 2;
}
