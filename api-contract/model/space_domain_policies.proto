syntax = "proto3";

package opsagent.v1;

import "api-contract/options.proto";
import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/jptrs93/opsagent/backend/apigen";

// SpaceDomainPolicy is one global rule on which spaces may publish which
// ingress hostnames. Enabled denies are checked first, then enabled allows;
// a hostname no allow covers is refused.
message SpaceDomainPolicy {
  uint64 id = 1 [(cp.js_type) = "number"];
  string name = 2 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
  bool disabled = 3;
  SpaceDomainRule rule = 4 [(cp.go_value) = true];
}

message SpaceDomainRule {
  SpaceDomainEffect effect = 1 [(cp.go_value) = true];
  SpaceDomainSelector selector = 2 [(cp.go_value) = true];
}

message SpaceDomainAllow {}

message SpaceDomainDeny {}

message SpaceDomainEffect {
  oneof value {
    option (buf.validate.oneof).required = true;
    SpaceDomainAllow allow = 1;
    SpaceDomainDeny deny = 2;
  }
}

message SpaceDomainSelector {
  AuthzSpaceSelector spaces = 1 [(cp.go_value) = true];
  DomainSelector domains = 2 [(cp.go_value) = true];
}

// DomainSelector is a selector position like the authz ones: exactly one of
// the two lists is set. A value is a hostname, or "*." and a hostname for
// every name below it at any depth.
message DomainSelector {
  DomainList exact_domains = 1;
  DomainList all_domains_excluding = 2;
}

message DomainList {
  repeated string values = 1;
}
