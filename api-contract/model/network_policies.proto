syntax = "proto3";

package opsagent.v1;

import "api-contract/options.proto";
import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/jptrs93/opsagent/backend/apigen";

// NetworkPolicy is one global override connectivity rule. A deployment peer's
// space resolves at render time, so space moves follow automatically.
message NetworkPolicy {
  uint64 id = 1 [(cp.js_type) = "number"];
  NetworkPolicyAction action = 2 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  NetworkPolicyPeer source = 3 [(cp.go_value) = true];
  NetworkPolicyPeer destination = 4 [(cp.go_value) = true];
  repeated NetPortMatch ports = 5; // empty = all ports and protocols
}

enum NetworkPolicyAction {
  NETWORK_POLICY_ACTION_UNSPECIFIED = 0;
  NETWORK_POLICY_ACTION_ALLOW = 1;
}

message NetworkPolicyPeer {
  NetworkPolicyPeerTarget target = 1 [(cp.go_value) = true];
}

message NetworkPolicyPeerTarget {
  oneof value {
    option (buf.validate.oneof).required = true;
    SpacePeer space = 1;
    DeploymentPeer deployment = 2;
  }
}

message SpacePeer {
  uint64 space_id = 1 [(cp.js_type) = "number"];
}

message DeploymentPeer {
  uint64 deployment_id = 1 [(cp.js_type) = "number"];
}

message NetPortMatch {
  NetProtocol protocol = 1 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  PortRange range = 2 [(cp.go_value) = true];
}

message PortRange {
  uint32 start = 1 [(buf.validate.field).uint32 = {gte: 1, lte: 65535}];
  uint32 end = 2 [(buf.validate.field).uint32 = {gte: 1, lte: 65535}];
}

enum NetProtocol {
  NET_PROTOCOL_UNSPECIFIED = 0;
  NET_PROTOCOL_TCP = 1;
  NET_PROTOCOL_UDP = 2;
}
