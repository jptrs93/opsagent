syntax = "proto3";

package opsagent.v1;

import "api-contract/options.proto";
import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/jptrs93/opsagent/backend/apigen";

message NodeRenameRequest {
  string identifier = 1;
  string name = 2;
}

message NodeAllowedSpacesRequest {
  string identifier = 1;
  repeated uint64 space_ids = 2 [(cp.js_type) = "number"];
}

message NodeDrainRequest {
  string identifier = 1;
  bool draining = 2;
}

message NodeEvictRequest {
  string identifier = 1;
  bool force = 2;
  int64 expected_seq = 3 [(cp.js_type) = "number"]; // 0 = no check
}

message NodeExposureRequest {
  string identifier = 1;
}

message NodeExposureItem {
  uint64 id = 1 [(cp.js_type) = "number"];
  string name = 2;
  uint64 space_id = 3 [(cp.js_type) = "number"];
  uint32 version = 4;
}

message NodeExposure {
  uint64 node_id = 1 [(cp.js_type) = "number"];
  repeated NodeExposureItem deployments = 2;
  repeated NodeExposureItem secrets = 3;
  repeated NodeExposureItem configs = 4;
  repeated NodeExposureItem issued_tls_deployments = 5;
  repeated string acme_hostnames = 6;
  bool github_token = 7;
}

message NixStoreResetRequest {
  string repo = 1;
}
