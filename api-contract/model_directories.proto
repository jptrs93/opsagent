syntax = "proto3";

package opsagent.v1;

import "api-contract/options.proto";

option go_package = "github.com/jptrs93/opsagent/backend/apigen";

// Directories of the shared secrets/configs file system. One tree per space;
// parent_id 0 is the implicit space root. Directory names share the sibling
// namespace with secrets and configs, so a name must be free across all three
// under the same parent.
message ValueDirectory {
  int32 id = 1;
  int32 space_id = 2;
  string name = 3;
  int32 parent_id = 4;     // 0 = the implicit root
  int64 created_at = 5 [(cp.go_type) = "time.Time", (cp.js_type) = "Date"];
  int32 author = 6;    // user id that created the directory; 0 = unknown/system, negative = agent of user -author
  bool deleted = 7;        // set on the state-stream update channel when removed
}

// Directories of the asset file system. One tree per space; parent_id 0 is the
// implicit space root. Directory keys share the sibling namespace with assets,
// so a key must be free in both under the same parent.
message AssetDirectory {
  int32 id = 1;
  int32 space_id = 2;
  string key = 3;
  int32 parent_id = 4;     // 0 = the implicit root
  int64 created_at = 5 [(cp.go_type) = "time.Time", (cp.js_type) = "Date"];
  int32 author = 6;    // user id that created the directory; 0 = unknown/system, negative = agent of user -author
  bool deleted = 7;        // set on the state-stream update channel when removed
}
