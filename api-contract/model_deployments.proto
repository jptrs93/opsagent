syntax = "proto3";

package opsagent.v1;

import "api-contract/options.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/jptrs93/opsagent/backend/apigen";

enum ContainerUpgradeStrategy {
  CONTAINER_UPGRADE_STRATEGY_UNSPECIFIED = 0;
  RECREATE = 1;
  ROLLOVER = 2;
}

enum NetworkingMode {
  NETWORKING_MODE_UNSPECIFIED = 0; // invalid for deployment config writes
  NETWORKING_MODE_VIRTUAL = 1;     // per-container netns on the virtual IPv6 network
  NETWORKING_MODE_HOST = 2;        // explicit opt-out: host network namespace
}

enum PortForwardProtocol {
  PORT_FORWARD_PROTOCOL_UNSPECIFIED = 0;
  PORT_FORWARD_PROTOCOL_TCP = 1;
  PORT_FORWARD_PROTOCOL_UDP = 2;
}

enum IngressKind {
  INGRESS_KIND_UNSPECIFIED = 0;
  INGRESS_KIND_TLS_PASSTHROUGH = 1;
  INGRESS_KIND_HTTPS = 2;
}

enum HttpBackendProtocol {
  HTTP_BACKEND_PROTOCOL_UNSPECIFIED = 0;
  HTTP_BACKEND_PROTOCOL_H2C = 1;
}

enum AcmeChallenge {
  ACME_CHALLENGE_UNSPECIFIED = 0;
  ACME_CHALLENGE_HTTP_01 = 1;
}

message PortForward {
  PortForwardProtocol protocol = 1;
  int32 host_port = 2;      // port published on the machine's host interfaces
  int32 container_port = 3; // port inside the virtual-mode container netns
}

message ContainerReadinessSignal {
  int32 timeout_seconds = 1; // 0 = default timeout
}

message AcmeCertSource {
  AcmeChallenge challenge = 1;
}

message SecretCertSource {
  int32 secret_version_id = 1;
}

message CertSource {
  AcmeCertSource acme = 1;
  SecretCertSource secret = 2;
}

message HttpsConfig {
  int32 container_port = 1;
  string path_prefix = 2;
  bool strip_prefix = 3;
  HttpBackendProtocol backend_protocol = 4;
  int64 max_request_body_bytes = 5;
  int32 flush_interval_ms = 6;
  CertSource cert_source = 7;
}

// TlsPassthroughConfig configures a TLS connection forwarded by SNI without
// terminating TLS. host_port zero uses the default HTTPS port (443).
message TlsPassthroughConfig {
  int32 host_port = 1;
  int32 container_port = 2;
}

// Ingress is a public route declared by a workload. Each kind owns its
// configuration so future route kinds do not acquire unrelated fields.
message Ingress {
  IngressKind kind = 1;
  string hostname = 2;
  TlsPassthroughConfig tls_passthrough_config = 3;
  HttpsConfig https_config = 4;
}

message NetworkingConfig {
  NetworkingMode mode = 1;
  repeated PortForward port_forwarding = 2; // virtual mode only; DNAT on host interfaces
  repeated Ingress ingress = 3;
}

enum RunningStatus {
  DEPLOYMENT_STATUS_UNKNOWN = 0;
  NO_DEPLOYMENT = 1;
  RUNNING = 2;
  STOPPED = 3;
  STARTING = 4;
  CRASHED = 5;
}

// PreparationStatus is the rollup across both preparation stages, and is what
// gates runner start. It is derived from InputsStatus and ImageStatus rather
// than stored or sent: see PreparerStatus.Rollup(). Nothing persists it, so the
// stages can never disagree with it.
enum PreparationStatus {
  PREPARATION_STATUS_UNKNOWN = 0;
  PREPARING = 2;
  DOWNLOADING = 3;
  READY = 4;
  FAILED = 5;
  PULLING = 6; // pulling a container image into the content store
}

// InputsStatus tracks stage 1: resolving the assets, secrets, and configs the
// workload needs at spawn. Independent of the artifact, and retried on its own
// once the artifact is already recorded.
enum InputsStatus {
  INPUTS_STATUS_UNKNOWN = 0;
  INPUTS_RESOLVING = 1;
  INPUTS_READY = 2;
  INPUTS_FAILED = 3;
}

// ImageStatus tracks stage 2: producing the runtime artifact. Named for the
// public case, where the artifact is always a local containerd image. The
// internal OpenDeploy self-deployment reaches IMAGE_DOWNLOADING/IMAGE_READY for
// an executable rather than an image; that path is redacted from public
// responses.
enum ImageStatus {
  IMAGE_STATUS_UNKNOWN = 0;
  IMAGE_BUILDING = 1;     // nix build
  IMAGE_PULLING = 2;      // pulling a remote image into the content store
  IMAGE_DOWNLOADING = 3;  // internal: downloading a GitHub release artifact
  IMAGE_READY = 4;
  IMAGE_FAILED = 5;
}

// Identifies the current deployment config version observed by a caller.
message DeploymentConfigVersionRef {
  int32 id = 1;
  int32 version = 2;
}

// ScheduledInstanceTarget is the primary-controlled desired runtime state for
// one scheduled instance assignment.
//
// The three RUN_* states are identical to the node's operator: all three mean
// "run this placement". They differ only in what the network state derives from
// them, which is what lets cross-node routing be a pure function of assignments
// with no status input. Exactly one placement per (deployment, ordinal) is
// RUN_SERVING at a time, and it is the one the instance's stable inbound
// address routes to.
enum ScheduledInstanceTarget {
  SCHEDULED_INSTANCE_TARGET_RUN_SERVING = 0;  // running and owns the inbound address
  SCHEDULED_INSTANCE_TARGET_TERMINATE = 1;    // node should terminate
  SCHEDULED_INSTANCE_TARGET_FINALIZED = 2;    // termination acknowledged; leave snapshot
  SCHEDULED_INSTANCE_TARGET_RUN_STANDBY = 3;  // warming replacement, not yet serving
  SCHEDULED_INSTANCE_TARGET_RUN_DRAINING = 4; // superseded but still running
}

// ScheduledInstance is one placement/runtime incarnation of a deployment
// instance ordinal on a node, pinned to a specific deployment config version.
message ScheduledInstance {
  int32 id = 1;
  int64 created_at = 2 [(cp.go_type) = "time.Time", (cp.js_type) = "Date"];
  int32 deployment_id = 3;
  int32 deployment_version = 4;
  int32 node_id = 5;
  int32 instance_ordinal = 6;
  ScheduledInstanceTarget state = 7;
  int32 space_id = 8;
}

// ScheduledInstanceStatus is the observed preparer/runner status for one
// scheduled instance. UpdatedAt is an HLC assigned by the owning node:
// max(wall_clock_now, prev+1ns). Monotonic per scheduled instance, so it
// doubles as wall-clock time and identity/ordering key.
message ScheduledInstanceStatus {
  google.protobuf.Timestamp updated_at = 1;
  int32 scheduled_instance_id = 2;
  int32 deployment_id = 3;
  PreparerStatus preparer = 4 [(cp.go_value) = true];
  RunnerStatus runner = 5 [(cp.go_value) = true];
}

// ScheduledInstanceState is the authoritative runtime assignment view: the
// schedule row, the immutable deployment config version it references, and the
// latest observed status for that instance.
message ScheduledInstanceState {
  ScheduledInstance instance = 1 [(cp.go_value) = true];
  DeploymentConfig config = 2 [(cp.go_value) = true];
  ScheduledInstanceStatus status = 3 [(cp.go_value) = true];
}

message ScheduledInstanceSnapshot {
  repeated ScheduledInstanceState items = 1;
}

message DeploymentConfigSnapshot {
  repeated DeploymentConfig items = 1;
}

// Preparation runs in two stages. The rollup that gates runner start is derived
// from the pair via Rollup(); field 3 held it before it became derived and must
// not be reused.
message PreparerStatus {
  int32 deployment_config_version = 1;
  string artifact = 2;
  reserved 3;
  InputsStatus inputs = 4;
  ImageStatus image = 5;
}

message RunnerStatus {
  // Status blobs are persisted; retired field numbers must not be reused.
  reserved 5, 9;
  int32 deployment_config_version = 1;
  int32 running_pid = 2;
  string running_artifact= 3;
  RunningStatus status = 4;
  int32 number_of_restarts = 6;
  int64 last_restart_at = 7 [(cp.go_type) = "time.Time", (cp.js_type) = "Date"];
  // Version string (commit/tag) the running artifact was built from. Derived at
  // read time by resolving deployment_config_version against the config history;
  // not persisted on the status row.
  string running_version = 8;
  // Networking diagnostics surfaced on the status card (e.g. an IPv4-only
  // listener that is unreachable at its instance address).
  repeated string network_diagnostics = 10;
}

enum EndpointState {
  ENDPOINT_STATE_UNSPECIFIED = 0;
  ENDPOINT_READY = 1;    // in the endpoint set: resolves in DNS, receives traffic
  ENDPOINT_DRAINING = 2; // removed from the set ahead of SIGTERM
  ENDPOINT_DOWN = 3;     // instance not running
}

// Endpoint is one instance of a deployment on the virtual network. Modeled as
// a set with per-endpoint state from day one (see networking design); every
// set has exactly one member until multi-instance deployments exist.
message Endpoint {
  int32 ordinal = 1;      // instance ordinal (0-based)
  string address = 2;     // stable inbound instance address I (version/run slots 0/0)
  reserved 3;
  reserved "machine"; // superseded by node_id
  EndpointState state = 4;
  int32 node_id = 5;      // canonical hosting node
}

message DeploymentConfig {
  // Field 3 carried the identity twice: as the nested DeploymentIdentity
  // sub-message until v0.0.444, then as the legacy_identity wire-compat
  // dual-write in v0.0.448 that bridged the migration to the flat fields.
  // Never reuse it.
  reserved 3;
  reserved "identity", "legacy_identity";
  int32 id = 1;
  int32 node_id = 2;
  int32 space_id = 10;
  int32 space_version = 12;  // per-deployment monotonically increasing space version
  string name = 11;
  int64 created_at = 4 [(cp.go_type) = "time.Time", (cp.js_type) = "Date"];
  int64 updated_at = 5 [(cp.go_type) = "time.Time", (cp.js_type) = "Date"];
  // user id; 0 = unknown/system, negative = agent of user -author
  int32 author = 6;
  int32 version = 7;  // per-deployment monotonically increasing config version
  DeploymentSpec spec = 8 [(cp.go_value) = true];
  bool deleted = 9;
}

message DeploymentSpec {
  NetworkingConfig networking = 1 [(cp.go_value) = true];

  // Exactly one workload field must currently be set. Future multi-container
  // support may allow multiple container fields, but container fields must
  // never be combined with microVM, VM, or systemd fields.
  ContainerSpec container_1_spec = 2;

  ContainerSpec container_2_spec = 3; // todo: for future multi container support only
  ContainerSpec container_3_spec = 4; // todo: for future multi container support only

  MicroVMSpec micro_vm_spec = 5; // todo: future implementation
  VMSpec vm_spec = 6;            // todo: future implementation
  SystemdSpec systemd_spec = 7;  // internal opendeploy deployments only
}

message MicroVMSpec {}

message VMSpec {}

message SystemdSpec {
  GithubRelease source = 1;
  SystemdRuntime runtime = 2;
  string version = 3;
  bool running = 4;
}

message GithubRelease {
  string repo = 1;
  string asset = 2;  // asset name (optional; falls back to the architecture-specific asset or first asset)
}

message SystemdRuntime{
  string name = 1;     // systemd unit name
  string bin_path = 2; // where the artifact is installed on disk
}

message ContainerSpec {
  ContainerBundleSource source = 1 [(cp.go_value) = true];
  ContainerRuntime runtime = 2  [(cp.go_value) = true];
  string version = 3;
  bool running = 4;
  ContainerUpgradeStrategy upgrade_strategy = 5; // default/unspecified = RECREATE
  ContainerReadinessSignal readiness_signal = 6; // used by ROLLOVER
}

message ContainerBundleSource {
  NixDockerBuild nix_docker_build = 1;
  RemoteDockerImage remote_image = 2;
}

message NixDockerBuild {
  string repo = 1;
  string flake = 2;   // path to flake.nix relative to repo root
  string target = 3;  // optional local flake target, e.g. .#radkitRpaClientImage; output must stream an OCI/Docker image tar
}

message RemoteDockerImage {
  string image = 1; // image repository ref, e.g. "docker.io/library/nginx". The version tag/digest comes from ContainerSpec.version.
}

message ContainerRuntime {
  // 9 and 10 held upgrade_strategy and readiness_signal before they moved to
  // ContainerSpec; this message is persisted inside spec blobs, so the numbers
  // must not be reused.
  reserved 9, 10, 11, 12;
  string user = 1;                                // OCI process.user (uid, uid:gid, or name); empty = image default
  map<string, EnvVarValue> env_vars = 2;          // env vars; values can be literal, secret/config/address ref, or asset
  repeated string override_command = 3;           // optional argv override (entrypoint+cmd); empty = image default
  string override_working_dir = 4;                // optional OCI process.cwd; empty = image default

  DefaultVolumeMount default_volume = 5 [(cp.go_value) = true];
  repeated CrossDeploymentMount cross_deployment_mounts = 6;
  repeated AssetMount asset_mounts = 8; // OpenDeploy-managed readonly asset file mounts
  repeated CustomHostMount mounts = 7; // Intended as an override pathway for edge cases that cannot be supports via other mount options.

  int32 dev_shm_size_kb = 13;                     // optional /dev/shm tmpfs size override in KiB
  int32 file_descriptor_limit = 14;               // optional RLIMIT_NOFILE override; unset uses the OpenDeploy default

  IssuedTLSMount issued_tls_mount = 15;
}

message DefaultVolumeMount {
   string container_path = 1;
   bool disabled = 2;
}

message CrossDeploymentMount {
  int32 deployment_id = 1;
  string container_path = 2;
  FilePermission permission = 3;
}

message EnvVarValue {
  optional int32 secret_version_id = 1; // immutable secret version row id
  optional int32 config_version_id = 2; // immutable config version row id
  optional string value = 3;
  string asset = 4;             // display asset key copied from the resolved asset
  int32 asset_version_id = 5;   // immutable asset version row id, used for local cache/downloads

  // A virtual deployment's ordinal-zero stable inbound address I. Both fields
  // are required together so workers can derive it without querying deployment
  // state. Address refs never resolve a run-scoped outbound address O.
  optional int32 address_deployment_id = 6;
  optional int32 address_space_id = 7;
}

message CustomHostMount {
  string host_path = 1;      // host path (must already exist; opsagent does not create these)
  string container_path = 2;
  FilePermission permission = 3;
}

message AssetMount {
  int32 asset_version_id = 1; // immutable asset version row id
  string container_path = 2;
  FilePermission permission = 3;
}

message IssuedTLSMount {
  string container_path = 1;
  repeated string extra_names = 2;
  bool ca_only = 3; // mount only the workload CA certificate; no leaf cert/key is issued
}

enum FilePermission {
  FILE_PERMISSION_UNSPECIFIED = 0;
  READ_WRITE = 1;
  READ_ONLY = 2;
  READ_EXECUTE = 3;
}
