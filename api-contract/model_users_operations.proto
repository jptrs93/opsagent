syntax = "proto3";

package opsagent.v1;

import "api-contract/options.proto";
import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/jptrs93/opsagent/backend/apigen";

// UserCreateRequest creates a pending user with its grants in one commit.
// name and password are optional: an invitee picks either from the link.
message UserCreateRequest {
  optional string name = 1 [(buf.validate.field).string.min_len = 1];
  optional string password = 2 [(buf.validate.field).string.min_len = 1];
  repeated AuthzGrantSource grants = 3;
}

// UserLinkRequest issues a single-use enrolment or recovery link for a user.
message UserLinkRequest {
  uint64 user_id = 1 [(cp.js_type) = "number"];
}

// UserLinkResponse is the only delivery of the link token.
message UserLinkResponse {
  string token = 1;
  string session_id = 2;
  int64 expires_at = 3 [(cp.go_type) = "time.Time", (cp.js_type) = "Date"];
}
