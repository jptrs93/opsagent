syntax = "proto3";

package opsagent.v1;

import "api-contract/options.proto";
import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/jptrs93/opsagent/backend/apigen";

// DeploymentUpdateRequest applies exactly one kind of change to a deployment,
// guarded by the seq of the last mutation the caller saw.
message DeploymentUpdateRequest {
  uint64 deployment_id = 1 [(cp.js_type) = "number"];
  int64 expected_seq = 2 [(cp.js_type) = "number"]; // 0 = no check
  oneof update {
    option (buf.validate.oneof).required = true;
    VersionOnlyUpdate version_only = 3;
    RunningOnlyUpdate running_only = 4;
    SpecUpdate spec = 5;
    AssignedSpaceUpdate assigned_space = 6;
    RestartUpdate restart = 7;
  }
}

// VersionOnlyUpdate deploys target_version: the workload version is set and
// the workload is marked running, leaving the rest of the spec untouched.
message VersionOnlyUpdate {
  string target_version = 1;
}

// RunningOnlyUpdate starts or stops the workload at its current version.
message RunningOnlyUpdate {
  bool desired_running = 1;
}

// SpecUpdate replaces the deployment spec wholesale, including the workload
// version.
message SpecUpdate {
  DeploymentSpec spec = 1 [(cp.go_value) = true];
}

// AssignedSpaceUpdate moves the deployment to another space. Validated like a
// create into the destination space.
message AssignedSpaceUpdate {
  uint64 space_id = 1 [(cp.js_type) = "number"];
}

// RestartUpdate replaces the running placement without changing anything:
// only the restart generation advances. Rejected for a stopped workload.
message RestartUpdate {}

message DeploymentCreateRequest {
  string name = 1;
  uint64 space_id = 2 [(cp.js_type) = "number"];
  DeploymentSpec spec = 3 [(cp.go_value) = true];
  Scheduling scheduling = 4 [(cp.go_value) = true];
}

message DeploymentGetRequest {
  uint64 id = 1 [(cp.js_type) = "number"];
}

// DeploymentRecord is one version of a deployment as a response carries it:
// the payload with the meta the stream would attach to it. For a deleted
// deployment the meta is the last version's with deleted set.
message DeploymentRecord {
  Deployment deployment = 1 [(cp.go_value) = true];
  EntityMeta meta = 2 [(cp.go_value) = true];
}

message DeploymentGetResponse {
  DeploymentRecord deployment = 1 [(cp.go_value) = true];
  repeated ScheduledInstance scheduled_instances = 2;
  repeated ScheduledInstanceStatus instance_statuses = 3;
}

message DeploymentDeleteRequest {
  uint64 deployment_id = 1 [(cp.js_type) = "number"];
  int64 expected_seq = 2 [(cp.js_type) = "number"]; // 0 = no check
}

message DeploymentHistoryRequest {
  uint64 deployment_id = 1 [(cp.js_type) = "number"];
}

// DeploymentHistoryEntry is one row of a deployment's history: a version of
// the deployment or an observed status.
message DeploymentHistoryEntry {
  oneof value {
    option (buf.validate.oneof).required = true;
    DeploymentRecord deployment = 1;
    ScheduledInstanceStatus status = 2;
  }
}

message DeploymentHistory {
  repeated DeploymentHistoryEntry entries = 1;
}

message RecentlyDeletedDeploymentsRequest {
  int32 limit = 1; // 0 or out of range = the server default
}

// RecentlyDeletedDeployments lists the final version of each deleted
// deployment, most recently deleted first. The spec is intact so a client can
// seed a new deployment from one.
message RecentlyDeletedDeployments {
  repeated DeploymentRecord items = 1;
}

// Version is the display shape for a deployable source item: a git commit, a
// container tag, or a GitHub release tag.
message Version {
  string id = 1;
  string label = 2;
  string author = 3;
  int64 time = 4 [(cp.go_type) = "time.Time", (cp.js_type) = "Date"];
}

message DeploymentVersionsRequest {
  uint64 deployment_id = 1 [(cp.js_type) = "number"];
  string selected_branch = 2; // optional: the git branch to list commits for
}

// DeploymentVersions lists the deployable versions of one deployment's source.
message DeploymentVersions {
  uint64 deployment_id = 1 [(cp.js_type) = "number"];
  oneof source {
    option (buf.validate.oneof).required = true;
    DeploymentNixImageBuildVersions nix_image_build = 2;
    DeploymentGithubReleaseVersions github_release = 3;
    DeploymentContainerImageVersions container_image = 4;
  }
}

message DeploymentNixImageBuildVersions {
  repeated string branches = 1;
  string selected_branch = 2;
  repeated Version commits = 3;
}

message DeploymentGithubReleaseVersions {
  repeated Version releases = 1;
}

message DeploymentContainerImageVersions {
  repeated Version tags = 1;
}

// RepoValidateRequest checks an image source's accessibility before a
// deployment using it is created or updated.
message RepoValidateRequest {
  oneof source {
    option (buf.validate.oneof).required = true;
    ValidateNixImageBuildSource nix_image_build = 1;
    ValidateContainerImageSource container_image = 2;
  }
}

message ValidateNixImageBuildSource {
  string repo_url = 1;              // e.g. github.com/owner/repo
  string selected_branch = 2;
  Version selected_commit = 3;
  string selected_flake_path = 4;   // empty = the path is not validated
  bool refresh_available_branches = 5;
  bool refresh_available_commits = 6;
  bool check_repo = 7;
  bool check_branch = 8;
  bool check_commit = 9;
  bool check_flake_path = 10;
}

message ValidateContainerImageSource {
  string image = 1;          // image repository without tag
  bool refresh_versions = 2; // list available image tags
}

message RepoValidateResponse {
  oneof source {
    option (buf.validate.oneof).required = true;
    ValidateNixImageBuildSourceResponse nix_image_build = 1;
    ValidateContainerImageSourceResponse container_image = 2;
  }
}

message ValidateNixImageBuildSourceResponse {
  string checked_repo_url = 1;
  ValidationResult git_repository = 2 [(cp.go_value) = true];
  string checked_branch = 3;
  ValidationResult branch_check = 4 [(cp.go_value) = true];
  Version checked_commit = 5;
  ValidationResult commit_check = 6 [(cp.go_value) = true];
  string checked_flake_path = 7;
  ValidationResult nix_flake_file = 8 [(cp.go_value) = true];
  AvailableBranches available_branches = 9 [(cp.go_value) = true];
  AvailableCommits available_commits = 10 [(cp.go_value) = true];
}

message ValidateContainerImageSourceResponse {
  ValidationResult image = 1 [(cp.go_value) = true];
  repeated Version tags = 2;
}

message ValidationResult {
  bool checked = 1;
  bool ok = 2;
  string message = 3; // human-readable, safe to display
}

message AvailableBranches {
  bool loaded = 1;
  optional string error_message = 2;
  repeated string branches = 3;
}

message AvailableCommits {
  bool loaded = 1;
  string branch = 2;
  optional string error_message = 3;
  repeated Version commits = 4;
}

message DeploymentRunReportRequest {
  uint64 scheduled_instance_id = 1 [(cp.js_type) = "number"];
  int32 run = 2;
}

message DeploymentRunReport {
  uint64 deployment_id = 1 [(cp.js_type) = "number"];
  uint32 deployment_version = 2;
  uint32 deployment_spec_version = 3;
  uint64 node_id = 4 [(cp.js_type) = "number"];
  uint32 instance_ordinal = 5;
  int32 run = 6;
  bool running = 7;
  int64 started_at = 8 [(cp.go_type) = "time.Time", (cp.js_type) = "Date"];
  optional int64 stopped_at = 9 [(cp.go_type) = "time.Time", (cp.js_type) = "Date"];
  optional int32 exit_code = 10;
  repeated string log_lines = 11;
  repeated string warnings = 12;
  RunningStatus status = 13;
}
