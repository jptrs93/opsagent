syntax = "proto3";

package opsagent.v1;

import "api-contract/model/scheduled_instances.proto";
import "api-contract/model/nodes.proto";
import "api-contract/model/networking.proto";

option go_package = "github.com/jptrs93/opsagent/backend/apigen";

message EnrollmentSecondaryMsg {
  EnrollmentHello hello = 1;
}

message EnrollmentHello {
  NodeReported reported = 6;               // reported.identifier is the stable secondary-generated machine id
  bytes secondary_certificate_request = 2; // PEM CSR generated by the secondary; private key stays local
  string opendeploy_version = 3;           // version currently running on the enrolling secondary
  reserved 1, 4, 5;
  reserved "requesting_machine_id", "underlay_address", "wg_public_key";
}

message EnrollmentPrimaryMsg {
  EnrollmentRequestStatus request_status = 1;
  EnrollmentAccepted accepted = 2;
}

message EnrollmentRequestList {
  repeated EnrollmentRequestStatus items = 1;
}

message EnrollmentAcceptRequest {
  int32 expected_version = 3;
  int32 id = 1;
  string node_name = 2;
}

message EnrollmentAccepted {
  int32 id = 1;
  string node_name = 2;
  bytes ca_certificate = 3;
  bytes secondary_certificate = 4;
  ClusterNetworkInfo cluster_network = 5;
  ScheduledInstanceState node_deployment = 6;
  ScheduledInstanceState node_net_deployment = 7;
  ClusterNetMap cluster_net_map = 8;
}
