syntax = "proto3";

package opsagent.v1;

import "api-contract/options.proto";
import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/jptrs93/opsagent/backend/apigen";

message EnrollmentSecondaryMsg {
  EnrollmentHello hello = 1;
}

message EnrollmentHello {
  NodeReported reported = 1 [(cp.go_value) = true];  // reported.identifier is the stable machine id
  bytes secondary_certificate_request = 2;          // PEM CSR; the private key stays on the node
  string opendeploy_version = 3;
  uint32 cluster_protocol_version = 4;
}

message EnrollmentPrimaryMsg {
  EnrollmentRequestStatus request_status = 1;
  EnrollmentAccepted accepted = 2;
}

message EnrollmentRequestList {
  repeated EnrollmentRequestStatus items = 1;
}

message EnrollmentAcceptRequest {
  uint64 id = 1 [(cp.js_type) = "number"];
  string node_name = 2;
  int64 expected_seq = 3 [(cp.js_type) = "number"]; // 0 = no check
}

message EnrollmentAccepted {
  uint64 id = 1 [(cp.js_type) = "number"];
  string node_name = 2;
  bytes ca_certificate = 3;
  bytes secondary_certificate = 4;
  ClusterNetworkInfo cluster_network = 5 [(cp.go_value) = true];
  ScheduledInstanceState node_deployment = 6 [(cp.go_value) = true];
  ScheduledInstanceState node_net_deployment = 7 [(cp.go_value) = true];
  ClusterNetMap cluster_net_map = 8 [(cp.go_value) = true];
}
