syntax = "proto3";

package opsagent.v1;

import "options.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/jptrs93/opsagent/backend/apigen";

service OpsagentHttpV1 {
  // Static file serving
  rpc Get(cp.Empty) returns (cp.Empty) {
    option (cp.go_custom) = true;
    option (cp.policy) = { policy_type: NO_AUTH };
  }

  rpc GetV1Healthz(cp.Empty) returns (cp.Empty) {
    option (cp.go_custom) = true;
    option (cp.policy) = { policy_type: NO_AUTH };
  }

  // Auth: master password bootstrap
  rpc PostV1AuthMaster(MasterPasswordRequest) returns (LoginResponse) {
    option (cp.policy) = { policy_type: NO_AUTH };
  }

  rpc PostV1AuthMasterPasswordSave(MasterPasswordSaveRequest) returns (cp.Empty) {
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1AuthMasterPasswordVerify(MasterPasswordVerifyRequest) returns (cp.Empty) {
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc GetV1AuthCurrentSession(cp.Empty) returns (LoginResponse) {
    option (cp.policy) = { policy_type: ANY_OF scopes: "passkey:create" scopes: "default" };
  }

  // Auth: passkey registration (requires passkey:create or default scope)
  rpc PostV1AuthPasskeyRegisterStart(EmptyRequest) returns (WebAuthNOptionsResponse) {
    option (cp.policy) = { policy_type: ANY_OF scopes: "passkey:create" scopes: "default" };
  }

  rpc PostV1AuthPasskeyRegisterFinish(WebAuthNFinishRequest) returns (LoginResponse) {
    option (cp.policy) = { policy_type: ANY_OF scopes: "passkey:create" scopes: "default" };
  }

  // Auth: passkey login
  rpc PostV1AuthPasskeyLoginStart(EmptyRequest) returns (WebAuthNOptionsResponse) {
    option (cp.policy) = { policy_type: NO_AUTH };
  }

  rpc PostV1AuthPasskeyLoginFinish(WebAuthNFinishRequest) returns (LoginResponse) {
    option (cp.policy) = { policy_type: NO_AUTH };
  }

  // Deployment state stream
  rpc PostV1StateStream(cp.Empty) returns (stream State) {
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  // Deployment updates (deploy, stop, etc.)
  rpc PostV1DeploymentUpdate(DeploymentUpdateRequest) returns (DesiredState) {
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1DeploymentHistory(DeploymentHistoryRequest) returns (DeploymentHistory) {
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1DeploymentLogSearch(LogSearchRequest) returns (stream LogLineBatch) {
    option (cp.url) = "/v1/deployment/log-search";
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1DeploymentPrepareOutput(PrepareOutputRequest) returns (stream PrepareOutputChunk) {
    option (cp.url) = "/v1/deployment/prepare-output";
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  // Cluster
  rpc GetV1ClusterStatus(cp.Empty) returns (ClusterStatusResponse) {
    option (cp.go_custom) = true;
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  // Create a new deployment.
  rpc PostV1DeploymentCreate(DeploymentCreateRequest) returns (DeploymentConfig) {
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1SpacesCreate(SpaceSetRequest) returns (Space) {
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1SpacesUpdate(SpaceSetRequest) returns (Space) {
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1SpacesDelete(SpaceDeleteRequest) returns (cp.Empty) {
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  // Version discovery: fetch available versions for a deployment on demand.
  rpc PostV1DeploymentVersions(DeploymentVersionsRequest) returns (DeploymentVersions) {
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  // Check whether an image source is reachable/authorized before a deployment
  // referencing it is created.
  rpc PostV1RepoValidate(ValidateSourceRequest) returns (ValidateSourceResponse) {
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  // Runtime configuration snapshot. Secret-valued fields carry only a secret
  // key; use PostV1SecretValueReveal to reveal the plaintext explicitly.
  rpc GetV1Config(cp.Empty) returns (DynamicConfiguration) {
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1ConfigUpdate(ConfigUpdateRequest) returns (DynamicConfiguration) {
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1GenerateExportedConfig(EmptyRequest) returns (ExportedConfigBlob) {
    option (cp.url) = "/v1/generate-exported-config";
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1SecretValueReveal(SecretValue) returns (SecretRevealResponse) {
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  // Secrets management. List yields names + metadata only; the decrypted value
  // is returned solely by the explicit Reveal call. Referenced from deployment
  // env via typed secretId references.
  rpc PostV1SecretsList(EmptyRequest) returns (SecretList) {
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1SecretsSet(SecretSetRequest) returns (SecretMeta) {
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  // Return the decrypted value of a single secret, on explicit operator
  // request. This is the only endpoint that returns a plaintext value.
  rpc PostV1SecretsReveal(SecretRevealRequest) returns (SecretRevealResponse) {
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1SecretsDelete(SecretDeleteRequest) returns (cp.Empty) {
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  // Lock/recovery state of the secrets store (for the UI).
  rpc PostV1SecretsStatus(EmptyRequest) returns (SecretsStatusResponse) {
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  // Generate (or rotate) the break-glass recovery code. The code is returned
  // exactly once in the response and is never stored in plaintext.
  rpc PostV1SecretsGenerateRecoveryCode(EmptyRequest) returns (SecretRecoveryCodeResponse) {
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  // Unlock a locked secrets store on a freshly recovered machine using the
  // recovery code; re-establishes the local machine key.
  rpc PostV1SecretsUnlock(SecretUnlockRequest) returns (SecretsStatusResponse) {
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  // Plain user-managed configuration values. These are not encrypted at rest
  // and can be referenced from deployment env via typed configId references.
  rpc PostV1UserConfigsList(EmptyRequest) returns (UserConfigList) {
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1UserConfigsSet(UserConfigSetRequest) returns (UserConfig) {
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1UserConfigsDelete(UserConfigDeleteRequest) returns (cp.Empty) {
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  // Versioned user-managed file assets. Small assets are stored inline; large
  // uploads are streamed to configured S3 storage and referenced by location.
  rpc PostV1AssetsList(EmptyRequest) returns (AssetList) {
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1AssetsGet(AssetGetRequest) returns (Asset) {
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1AssetsSet(AssetSetRequest) returns (Asset) {
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1AssetsUpload(cp.Empty) returns (Asset) {
    option (cp.url) = "/v1/assets/upload";
    option (cp.go_custom) = true;
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1AssetsRename(cp.Empty) returns (Asset) {
    option (cp.url) = "/v1/assets/rename";
    option (cp.go_custom) = true;
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1AssetsDelete(AssetDeleteRequest) returns (cp.Empty) {
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  // List pending and historical worker enrollment requests for operator review.
  rpc PostV1EnrollmentList(cp.Empty) returns (EnrollmentRequestList) {
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  // Accept a connected worker's pending enrollment request and issue its
  // cluster client certificate using the operator-chosen machine name.
  rpc PostV1EnrollmentAccept(EnrollmentAcceptRequest) returns (EnrollmentRequestStatus) {
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }
}

// OpsagentClusterV1 is the primary↔worker cluster transport. It is served on
// a separate mTLS listener (not the public front-end server), so it gets its
// own generated mux (CreateOpsagentClusterV1Mux) and client
// (OpsagentClusterV1Capi). Peer identity is the client cert CN; auth is mTLS,
// hence NO_AUTH at the policy layer.
service OpsagentClusterV1 {
  rpc GetV1ClusterGithubCredentials(cp.Empty) returns (GithubCredentials) {
    option (cp.url) = "/v1/cluster/github-credentials";
    option (cp.policy) = { policy_type: NO_AUTH };
  }

  rpc GetV1ClusterAsset(cp.Empty) returns (cp.Empty) {
    option (cp.url) = "/v1/cluster/asset";
    option (cp.go_custom) = true;
    option (cp.policy) = { policy_type: NO_AUTH };
    option (cp.compression) = COMPRESSION_MODE_NEVER;
  }

  rpc GetV1ClusterSecrets(ClusterSecretsRequest) returns (ClusterSecretsResponse) {
    option (cp.url) = "/v1/cluster/secrets";
    option (cp.policy) = { policy_type: NO_AUTH };
  }

  rpc GetV1ClusterConfigs(ClusterConfigsRequest) returns (ClusterConfigsResponse) {
    option (cp.url) = "/v1/cluster/configs";
    option (cp.policy) = { policy_type: NO_AUTH };
  }

  // PostV1ClusterConnect is the long-lived bidirectional stream between a
  // worker (client) and the primary (server). The worker sends MsgToMaster
  // (status writes, log data); the primary sends MsgToWorker (deployment
  // snapshot/updates, log requests, keepalive frames). Dispatch on whichever
  // field of each message is non-nil.
  rpc PostV1ClusterConnect(stream MsgToMaster) returns (stream MsgToWorker) {
    option (cp.policy) = { policy_type: NO_AUTH };
  }
}

// EnrollmentV1 is the unauthenticated bootstrap surface for machines that do
// not yet have a cluster client certificate. A worker opens a stream here and
// waits until the primary operator enrolls it into the mTLS cluster.
service EnrollmentV1 {
  rpc PostV1EnrollmentRequest(stream EnrollmentWorkerMsg) returns (stream EnrollmentPrimaryMsg) {
    option (cp.policy) = { policy_type: NO_AUTH };
  }
}

// === Enrollment messages ===

message EnrollmentWorkerMsg {
  EnrollmentHello hello = 1;
}

message EnrollmentHello {
  string requesting_machine_id = 1;        // stable worker-generated ID; not the operator-chosen worker name
  bytes worker_certificate_request = 2;    // PEM CSR generated by the worker; private key stays local
  string opendeploy_version = 3;           // version currently running on the enrolling worker
}

message EnrollmentPrimaryMsg {
  EnrollmentRequestStatus request_status = 1;
  EnrollmentAccepted accepted = 2;
}

message EnrollmentRequestStatus {
  int32 id = 1;
  int64 created_at = 2 [(cp.go_type) = "time.Time", (cp.js_type) = "Date"];
  int64 updated_at = 3 [(cp.go_type) = "time.Time", (cp.js_type) = "Date"];
  string requesting_ip_address = 4;
  string requesting_machine_id = 5;
  string status = 6; // waiting | disconnected | accepted
  string opendeploy_version = 7;
}

message EnrollmentRequestList {
  repeated EnrollmentRequestStatus items = 1;
}

message EnrollmentAcceptRequest {
  int32 id = 1;
  string worker_name = 2;
}

message EnrollmentAccepted {
  int32 id = 1;
  string worker_name = 2;
  bytes ca_certificate = 3;
  bytes worker_certificate = 4;
}

message GithubCredentials {
  string token = 1;
  int64 changed_at = 2 [(cp.go_type) = "time.Time", (cp.js_type) = "Date"];
}

message ClusterSecretsRequest {
  repeated int32 ids = 1;
}

message ClusterSecretValue {
  int32 id = 1;
  bytes value = 2;
}

message ClusterSecretsResponse {
  repeated ClusterSecretValue items = 1;
}

message ClusterConfigsRequest {
  repeated int32 ids = 1;
}

message ClusterConfigValue {
  int32 id = 1;
  string value = 2;
}

message ClusterConfigsResponse {
  repeated ClusterConfigValue items = 1;
}

// SecretValue references an encrypted value by key. It intentionally carries no
// plaintext; callers must reveal it through an explicit endpoint.
message SecretValue {
  string key = 1;
}

message DynamicConfiguration {
  string web_listen = 1;
  bool web_http_only = 2;
  string cluster_listen = 3;
  string enrollment_listen = 4;
  repeated string acme_hosts = 5;
  string acme_email = 6;

  SecretValue github_token = 7;

  string backup_s3_access_key_id = 8;
  SecretValue backup_s3_secret_access_key = 9;
  string backup_s3_bucket = 10;
  string backup_s3_path = 11;
  string backup_s3_region = 12;
  string backup_s3_endpoint = 13;
  bool backup_enabled = 14;

  bool large_asset_s3_enabled = 15;
  string large_asset_s3_access_key_id = 16;
  SecretValue large_asset_s3_secret_access_key = 17;
  string large_asset_s3_bucket = 18;
  string large_asset_s3_path = 19;
  string large_asset_s3_region = 20;
  string large_asset_s3_endpoint = 21;
}

message ConfigUpdateRequest {
  repeated ConfigValueUpdate values = 1;
}

message ConfigValueUpdate {
  string key = 1;
  string value = 2;
}

message ExportedConfigBlob {
  bytes blob = 1;
}

// === Auth messages ===

message EmptyRequest {}

message MasterPasswordRequest {
  string password = 1;
  string username = 2;
}

message MasterPasswordVerifyRequest {
  string password = 1;
}

message MasterPasswordSaveRequest {
  string password = 1;
}

message LoginResponse {
  string token = 1;
  int32 user_id = 2;
  repeated string scopes = 3;
  string name = 4;
  int64 expiry = 5 [(cp.go_type) = "time.Time", (cp.js_type) = "Date"];
}

message WebAuthNOptionsResponse {
  string session_id = 1;
  bytes options_json = 2;
}

message WebAuthNFinishRequest {
  string session_id = 1;
  bytes credential_json = 2;
}

// === Secrets messages ===

// SecretMeta describes a stored secret WITHOUT its value. The encrypted value
// never leaves the server.
message SecretMeta {
  string name = 1;
  string group = 2;        // optional grouping label
  int64 created_at = 3 [(cp.go_type) = "time.Time", (cp.js_type) = "Date"];
  int64 updated_at = 4 [(cp.go_type) = "time.Time", (cp.js_type) = "Date"];
  int32 updated_by = 5;
  int32 id = 6;
  bool deleted = 7;
  int32 space_id = 8;
}

message SecretList {
  repeated SecretMeta items = 1;
}

message SecretSetRequest {
  string name = 1;
  string group = 2;
  bytes value = 3;         // plaintext secret value; encrypted at rest, never returned
  int32 space_id = 4;
}

message SecretDeleteRequest {
  string name = 1;
}

message SecretRevealRequest {
  string name = 1;
}

message SecretRevealResponse {
  bytes value = 1;         // decrypted plaintext; returned only on explicit reveal
}

message SecretsStatusResponse {
  bool unlocked = 1;            // SMK is loaded; secrets can be read/written
  bool recovery_configured = 2; // a recovery code has been generated
}

message SecretRecoveryCodeResponse {
  string code = 1;         // shown to the operator exactly once
}

message SecretUnlockRequest {
  string code = 1;         // the recovery code
}

// === User config messages ===

message UserConfig {
  string name = 1;
  string group = 2;        // optional grouping label
  string value = 3;        // plaintext value; not encrypted at rest
  int64 created_at = 4 [(cp.go_type) = "time.Time", (cp.js_type) = "Date"];
  int64 updated_at = 5 [(cp.go_type) = "time.Time", (cp.js_type) = "Date"];
  int32 updated_by = 6;
  int32 id = 7;
  bool deleted = 8;
  int32 space_id = 9;
}

message UserConfigList {
  repeated UserConfig items = 1;
}

message UserConfigSetRequest {
  string name = 1;
  string group = 2;
  string value = 3;
  int32 space_id = 4;
}

message UserConfigDeleteRequest {
  string name = 1;
}

// === Asset messages ===

message AssetMeta {
  string key = 1;
  int64 created_at = 2 [(cp.go_type) = "time.Time", (cp.js_type) = "Date"];
  int32 version = 3;
  string format = 4;       // e.g. text, nginx, yaml, json
  string location = 5;     // empty for inline blob-backed assets
  int32 size_bytes = 6;
  int32 id = 7;
  int32 space_id = 8;
}

message Asset {
  string key = 1;
  int64 created_at = 2 [(cp.go_type) = "time.Time", (cp.js_type) = "Date"];
  int32 version = 3;
  string format = 4;
  string location = 5;
  bytes blob = 6;
  int32 id = 7;
  int32 space_id = 8;
  int32 size_bytes = 9;
}

message AssetList {
  repeated AssetMeta items = 1;
}

message AssetGetRequest {
  string key = 1;
  int32 version = 2; // 0 = latest
}

message AssetSetRequest {
  string key = 1;
  string format = 2;
  bytes blob = 3;
  int32 space_id = 4;
}

message AssetDeleteRequest {
  string key = 1;
}

// === Deployment config messages ===

message NixDockerBuildConfig {
  string repo = 1;
  string flake = 2; // path to flake.nix relative to repo root; default output must stream an OCI/Docker image tar
}

// Internal-only source for the OPENDEPLOY deployment. Public deployment
// create/update validation rejects this branch.
message GithubReleaseConfig {
  string repo = 1;
  string asset = 2; // asset name (optional; falls back to first asset). With download_script, the output file the script leaves in the download dir.
  string tag = 3;   // optional explicit tag
  string download_script = 4; // optional bash script run instead of downloading an asset; receives the version tag as $1, runs in the download dir
}

message ContainerImageConfig {
  string image = 1; // image repository ref, e.g. "docker.io/library/nginx". The
                    // version tag/digest comes from DesiredState.Version.
}

message PrepareConfig {
  // field 1 was nix_build; do not reuse.
  GithubReleaseConfig github_release = 2;
  ContainerImageConfig container_image = 3;
  NixDockerBuildConfig nix_docker_build = 4;
}

message EnvVarValue {
  optional int32 secret_id = 1;
  optional int32 config_id = 2;
  optional string value = 3;
  string asset = 4;     // operator-selected asset key; resolved to immutable asset_id/version
  int32 asset_id = 5;   // resolved asset row id, used for local cache/downloads
  int32 version = 6;    // resolved immutable asset version
}

// Internal-only runner for the OPENDEPLOY deployment. Public deployment
// create/update validation rejects this branch.
message SystemdRunnerConfig {
  string name = 1;     // systemd unit name
  string bin_path = 2; // where the artifact is installed on disk
}

message ContainerMount {
  string host = 1;      // host path (must already exist; opsagent does not create these)
  string container = 2; // destination path inside the container
  bool readonly = 3;
}

message ContainerAssetMount {
  string asset = 1;     // asset key selected by the operator
  int32 version = 2;    // resolved immutable asset version
  string path = 3;      // destination file path inside the container
  string format = 4;    // copied from the resolved asset for display/debugging
  int32 asset_id = 5;   // resolved asset row id, used for local cache/downloads
}

enum ContainerUpgradeStrategy {
  CONTAINER_UPGRADE_STRATEGY_UNSPECIFIED = 0;
  RECREATE = 1;
  ROLLOVER = 2;
}

enum ContainerLogConsumer {
  CONTAINER_LOG_CONSUMER_UNSPECIFIED = 0;
  STANDARD = 1;
  JSON = 2;
  OPENOBSERVE = 3;
}

message ContainerReadinessSignal {
  int32 timeout_seconds = 1; // 0 = default timeout
}

message OpenObserveConsumerConfig {
  string url = 1;
  string stream = 2;
  int32 token_secret_id = 3;
}

message ContainerRunnerConfig {
  string user = 1;             // OCI process.user (uid, uid:gid, or name); empty = image default
  map<string, EnvVarValue> env_vars = 2; // env vars; values can be literal, secret ref, or config ref
  repeated string command = 3; // optional argv override (entrypoint+cmd); empty = image default
  string working_dir = 4;      // optional OCI process.cwd; empty = image default
  string data_mount_path = 5;  // override the default data-volume mount point inside the container
  bool disable_data_volume = 6;// opt out of the default per-deployment data volume
  repeated ContainerMount mounts = 7; // additional host bind mounts
  repeated ContainerAssetMount asset_mounts = 8; // OpenDeploy-managed readonly asset file mounts
  ContainerUpgradeStrategy upgrade_strategy = 9; // default/unspecified = RECREATE
  ContainerReadinessSignal readiness_signal = 10; // used by ROLLOVER
  ContainerLogConsumer log_consumer = 11; // default/unspecified = STANDARD
  OpenObserveConsumerConfig openobserve_consumer = 12;
}

message RunnerConfig {
  // field 1 was os_process; do not reuse.
  SystemdRunnerConfig systemd = 2 [(cp.go_value) = true];
  ContainerRunnerConfig container = 3 [(cp.go_value) = true];
}


// === Deployment status messages ===

enum RunningStatus {
  DEPLOYMENT_STATUS_UNKNOWN = 0;
  NO_DEPLOYMENT = 1;
  RUNNING = 2;
  STOPPED = 3;
  STARTING = 4;
  CRASHED = 5;
}

enum PreparationStatus {
  PREPARATION_STATUS_UNKNOWN = 0;
  PREPARING = 2;
  DOWNLOADING = 3;
  READY = 4;
  FAILED = 5;
  PULLING = 6; // pulling a container image into the content store
}

// State is the UI stream envelope. The primary emits an initial snapshot
// (and user config) on subscribe, then emits updates as the store sees
// changes, with periodic heartbeats to keep the HTTP connection alive.
message State {
  bool heartbeat = 1;
  DeploymentWithStatusSnapshot deployments_snapshot = 2;
  DeploymentWithStatus deployment_update = 3;
  repeated User users_snapshot = 6;
  User user_update = 7;
  ClusterMachineList machines_snapshot = 8;
  ClusterMachine machine_update = 9;
  EnrollmentRequestList enrollments_snapshot = 10;
  EnrollmentRequestStatus enrollment_update = 11;
  SecretReferenceList secrets_snapshot = 12;
  SecretReference secret_update = 13;
  UserConfigReferenceList user_configs_snapshot = 14;
  UserConfigReference user_config_update = 15;
  SecretsStatusResponse secrets_status_snapshot = 16;
  SecretList secret_metas_snapshot = 17;
  SecretMeta secret_meta_update = 18;
  UserConfigList user_config_values_snapshot = 19;
  UserConfig user_config_value_update = 20;
  SpaceList spaces_snapshot = 21;
  Space space_update = 22;
}

message Space {
  int32 id = 1;
  string name = 2;
  bool deleted = 3;
}

message SpaceList {
  repeated Space items = 1;
}

message SpaceSetRequest {
  int32 id = 1;
  string name = 2;
}

message SpaceDeleteRequest {
  int32 id = 1;
}

message SecretReference {
  int32 id = 1;
  string name = 2;
  bool deleted = 3;
  int32 space_id = 4;
}

message SecretReferenceList {
  repeated SecretReference items = 1;
}

message UserConfigReference {
  int32 id = 1;
  string name = 2;
  bool deleted = 3;
  int32 space_id = 4;
}

message UserConfigReferenceList {
  repeated UserConfigReference items = 1;
}

message DeploymentWithStatusSnapshot {
  repeated DeploymentWithStatus items = 1;
}

message ClusterMachineList {
  repeated ClusterMachine items = 1;
}

message DeploymentHistoryEntry {
  DeploymentConfig config = 1;
  DeploymentStatus status = 2;
}

message DeploymentHistory {
  repeated DeploymentHistoryEntry entries = 1;
}

// === Deployment update / version request messages ===

message DeploymentUpdateRequest {
  int32 deployment_id = 5;
  string target_version = 2;
  bool stop = 3;
  int32 version = 4;
  DeploymentSpec spec = 6 [(cp.go_value) = true];  // optional: update deployment spec
  optional int32 space_id = 7;                     // optional: move deployment to another space
}

message DeploymentCreateRequest {
  DeploymentIdentifier config_id = 1 [(cp.go_value) = true];
  DeploymentSpec spec = 2 [(cp.go_value) = true];
}

message DeploymentHistoryRequest {
  int32 deployment_id = 1;
}

message PrepareOutputRequest {
  int32 deployment_id = 3;
  int32 version = 2;  // config version whose log to stream (0 = latest)
}

message PrepareOutputChunk {
  bytes data = 1;
}

message RunOutputRequest {
  int32 deployment_id = 3;
  int32 version = 2;  // config version whose log to stream (0 = latest)
}

message DeploymentLogRequest {
  RunOutputRequest runner_output = 1;
  PrepareOutputRequest preparer_output = 2;
  string request_id = 3;  // Unique ID for multiplexing parallel log streams over a single cluster session.
}

message LogSearchRequest {
  int32 deployment_id = 1;
  int64 time_start = 2 [(cp.go_type) = "time.Time", (cp.js_type) = "Date"];
  int64 time_end = 3 [(cp.go_type) = "time.Time", (cp.js_type) = "Date"];
  string level_min = 4;
  map<string, string> search_keys = 5;
  string request_id = 6;  // Internal: multiplexes worker log-search streams.
  int32 log_line_limit = 7;
  int32 config_version = 8;  // Deployment config version to search (0 = all versions).
}

message LogLine {
  int64 time = 1 [(cp.go_type) = "time.Time", (cp.js_type) = "Date"];
  string level = 2;
  string msg = 3;
  map<string, string> props = 4;
}

message LogLineBatch {
  repeated LogLine lines = 1;
}


message DeploymentIdentifier {
  int32 space_id = 1;
  string machine = 2;
  string name = 3;
}

message DeploymentSpec {
  PrepareConfig prepare = 1 [(cp.go_value) = true];
  RunnerConfig runner = 2 [(cp.go_value) = true];
}

message DesiredState {
  string version = 1;
  bool running = 2;
}

message DeploymentConfig {
  int32 id = 8;                          // primary key (integer deployment id)
  DeploymentIdentifier config_id = 1 [(cp.go_value) = true];    // human-readable identity (display metadata)
  int32 version = 2;                      // per-deployment monotonically increasing config version
  int64 updated_at = 3 [(cp.go_type) = "time.Time", (cp.js_type) = "Date"];
  int32 updated_by = 4;
  DeploymentSpec spec = 5 [(cp.go_value) = true];
  DesiredState desired_state = 6 [(cp.go_value) = true];
  bool deleted = 7;
  int64 created_at = 9 [(cp.go_type) = "time.Time", (cp.js_type) = "Date"];  // first-seen time of this deployment identity
}


message DeploymentWithStatus {
  DeploymentConfig Config = 1 [(cp.go_value) = true];
  DeploymentStatus status = 2 [(cp.go_value) = true];
}

message DeploymentStatus {
  // Hybrid logical clock assigned by the node that owns the deployment:
  // max(wall_clock_now, prev+1ns). Monotonic per deployment, so it doubles as
  // both the status's wall-clock time and its identity/ordering key (it backs
  // the deployment_status_history primary key and gates replication). May run
  // a few ns ahead of true wall-clock under same-tick writes or clock
  // regressions. Tag 7 (not 1) so older cluster peers skip it gracefully
  // during a rolling upgrade rather than mis-decoding the old int64 field.
  google.protobuf.Timestamp updated_at = 7;
  int32 deployment_id = 6;  // integer deployment id
  PreparerStatus preparer = 4 [(cp.go_value) = true];
  RunnerStatus runner = 5 [(cp.go_value) = true];
}

message PreparerStatus {
  int32 deployment_config_version = 1;
  string artifact = 2;
  PreparationStatus status = 3;
}

message RunnerStatus {
  int32 deployment_config_version = 1;
  int32 running_pid = 2;
  string running_artifact= 3;
  RunningStatus status = 4;
  int32 number_of_restarts = 6;
  int64 last_restart_at = 7 [(cp.go_type) = "time.Time", (cp.js_type) = "Date"];
  // Version string (commit/tag) the running artifact was built from. Derived at
  // read time by resolving deployment_config_version against the config history;
  // not persisted on the status row.
  string running_version = 8;
}



// Version is the shared display shape for a deployable source item: a git
// commit, a container tag, or a GitHub release tag.
message Version {
  string id = 1;
  string label = 2;
  string author = 3;
  int64 time = 4 [(cp.go_type) = "time.Time", (cp.js_type) = "Date"];
}

// DeploymentVersions returns source-specific deployable versions for one deployment.
message DeploymentVersions {
  int32 deployment_id = 1;
  DeploymentNixDockerBuildVersions nix_docker_build = 2;
  DeploymentGithubReleaseVersions github_release = 3;
  DeploymentContainerImageVersions container_image = 4;
}

message DeploymentNixDockerBuildVersions {
  repeated string branches = 1;
  string selected_branch = 2;
  repeated Version commits = 3;
}

message DeploymentGithubReleaseVersions {
  repeated Version releases = 1;
}

message DeploymentContainerImageVersions {
  repeated Version tags = 1;
}

// DeploymentVersionsRequest fetches available versions for a deployment on demand.
message DeploymentVersionsRequest {
  int32 deployment_id = 1;
  string selected_branch = 2;  // optional: specific git branch to list commits for
}

// ValidateSourceRequest checks an image source's accessibility before a
// deployment using it is created/updated. Exactly one source field must be set.
message ValidateSourceRequest {
  ValidateNixDockerBuildSource nix_docker_build = 2;
  ValidateContainerImageSource container_image = 4;
}

message ValidateNixDockerBuildSource {
  string repo_url = 1;     // e.g. "github.com/owner/repo"
  string selected_branch = 2;       // optional branch/scope whose versions should be listed
  Version selected_commit = 3;       // optional exact commit to validate
  string selected_flake_path = 4;   // optional path to flake.nix; when empty, path is not validated

  bool refresh_available_branches = 5; // force loading available branches
  bool refresh_available_commits = 6; // force loading commits for selected_branch

  bool check_repo = 7;
  bool check_branch = 8;
  bool check_commit = 9; // validate commit exists
  bool check_flake_path = 10; // validate flake_path exists at branch/commit
}

message ValidateNixDockerBuildSourceResponse {
  string checked_repo_url = 1;
  ValidationResult git_repository = 2 [(cp.go_value) = true];
  string checked_branch = 3;
  ValidationResult branch_check = 4 [(cp.go_value) = true];
  Version checked_commit = 5;
  ValidationResult commit_check = 6 [(cp.go_value) = true];
  string checked_flake_path = 7;
  ValidationResult nix_flake_file = 8 [(cp.go_value) = true];

  AvailableBranches available_branches = 9 [(cp.go_value) = true];
  AvailableCommits available_commits = 10 [(cp.go_value) = true];
}

message AvailableCommits {
  bool loaded = 1;
  string branch = 2;
  optional string errorMessage = 3;
  repeated Version commits = 4;
}

message AvailableBranches {
  bool loaded = 1;
  optional string errorMessage = 2;
  repeated string branches = 3;
}

message RepoValidationResult {
  bool checked = 1;
  string repo_url = 2;
  bool ok = 3;
  string message = 4;  // human-readable result, safe to display to the user
}


message ValidationResult {
  bool checked = 1;
  bool ok = 2;
  string message = 3;  // human-readable result, safe to display to the user
}


message ValidateContainerImageSource {
  string image = 1;        // image repository without tag; e.g. "ghcr.io/owner/app"
  bool refresh_versions = 2; // list available image tags/versions
}



message ValidateSourceResponse {
  ValidateNixDockerBuildSourceResponse nix_docker_build = 2;
  ValidateContainerImageSourceResponse container_image = 4;
}



message ValidateContainerImageSourceResponse {
  ValidationResult image = 1 [(cp.go_value) = true];
  repeated Version tags = 2;
}

// === Storage-only messages ===

message User {
  int32 id = 1;
  string name = 2;
}


message WebAuthnCredential {
  bytes id = 1;
  bytes data = 2;
}

message InternalUser {
  int32 id = 1;
  bytes web_auth_n_id = 2;
  string name = 3;
  repeated WebAuthnCredential credentials = 4;
}

message PublicKeyRecord {
  string kid = 1;
  bytes key_bytes = 2;
}

// === Cluster status ===

message ClusterMachine {
  string name = 1;
  bool is_primary = 2;
  bool connected = 3;
  int64 connected_at = 4 [(cp.go_type) = "time.Time", (cp.js_type) = "Date"];
}

message ClusterStatusResponse {
  repeated ClusterMachine machines = 1;
}

// === Cluster protocol ===
//
// Primary and worker communicate over a length-prefixed TLS TCP stream.
// Each frame is [4-byte big-endian length][protobuf payload].
// Primary sends MsgToWorker; worker sends MsgToMaster.
// Dispatch on whichever field is non-nil.

message MsgToWorker {
  DeploymentWithStatusSnapshot deployments_snapshot = 1;
  DeploymentConfig deployment_update = 2;
  PrepareOutputRequest prepare_log_request = 3;
  RunOutputRequest run_log_request = 4;
  DeploymentLogRequest deployment_log_request = 5;
  string stop_log_request_id = 6;  // Cancel an active log stream by its request_id.
  LogSearchRequest log_search_request = 7;
}

message MsgToMaster {
  DeploymentStatus status_write = 1;
  bytes log_data = 2;
  bool log_end = 3;
  string log_request_id = 4;  // Tags log_data/log_end with the originating request_id.
  LogLineBatch log_lines = 5 [(cp.go_value) = true];
}
