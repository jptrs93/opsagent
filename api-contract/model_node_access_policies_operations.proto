syntax = "proto3";

package opsagent.v1;

import "api-contract/options.proto";
import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/jptrs93/opsagent/backend/apigen";

message NodeAccessPolicyCreateRequest {
  string name = 1;
  bool disabled = 2;
  NodeSelector nodes = 3 [(cp.go_value) = true];
  NodeAccessRule rule = 4 [(cp.go_value) = true];
}

message NodeAccessPolicyUpdateRequest {
  uint64 id = 1 [(cp.js_type) = "number"];
  int64 expected_seq = 2 [(cp.js_type) = "number"]; // 0 = no check
  string name = 3;
  bool disabled = 4;
  NodeSelector nodes = 5 [(cp.go_value) = true];
  NodeAccessRule rule = 6 [(cp.go_value) = true];
}

message NodeAccessPolicyDeleteRequest {
  uint64 id = 1 [(cp.js_type) = "number"];
}
