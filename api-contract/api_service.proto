syntax = "proto3";

package opsagent.v1;

import "api-contract/model_assets.proto";
import "api-contract/model_assets_operations.proto";
import "api-contract/model_auth_operations.proto";
import "api-contract/model_authz.proto";
import "api-contract/model_authz_operations.proto";
import "api-contract/model_common.proto";
import "api-contract/model_configs.proto";
import "api-contract/model_configs_operations.proto";
import "api-contract/model_deployments.proto";
import "api-contract/model_deployments_operations.proto";
import "api-contract/model_directories.proto";
import "api-contract/model_directories_operations.proto";
import "api-contract/model_enrollment.proto";
import "api-contract/model_enrollment_operations.proto";
import "api-contract/model_global_operations.proto";
import "api-contract/model_logs.proto";
import "api-contract/model_logs_operations.proto";
import "api-contract/model_nodes.proto";
import "api-contract/model_nodes_operations.proto";
import "api-contract/model_primary_config.proto";
import "api-contract/model_secrets.proto";
import "api-contract/model_secrets_operations.proto";
import "api-contract/model_sessions.proto";
import "api-contract/model_sessions_operations.proto";
import "api-contract/model_spaces.proto";
import "api-contract/model_spaces_operations.proto";
import "api-contract/options.proto";

option go_package = "github.com/jptrs93/opsagent/backend/apigen";

service ApiServer {
  rpc Get(cp.Empty) returns (cp.Empty) {
    option (cp.go_custom) = true;
    option (cp.policy) = { policy_type: NO_AUTH };
  }

  rpc GetV1Healthz(cp.Empty) returns (cp.Empty) {
    option (cp.go_custom) = true;
    option (cp.policy) = { policy_type: NO_AUTH };
  }

  rpc PostV1ClusterSettingsGet(EmptyRequest) returns (ClusterSettings) {
    option (cp.url) = "/v1/cluster-settings/get";
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1ClusterSettingsUpdate(ClusterSettings) returns (ClusterSettings) {
    option (cp.url) = "/v1/cluster-settings/update";
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1AuthMaster(MasterPasswordRequest) returns (LoginResponse) {
    option (cp.policy) = { policy_type: NO_AUTH };
  }

  rpc PostV1AuthMasterPasswordSave(MasterPasswordSaveRequest) returns (cp.Empty) {
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1AuthMasterPasswordVerify(MasterPasswordVerifyRequest) returns (cp.Empty) {
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc GetV1AuthCurrentSession(cp.Empty) returns (LoginResponse) {
    option (cp.policy) = { policy_type: ANY_OF scopes: "passkey:create" scopes: "default" };
  }

  rpc PostV1AuthPasskeyRegisterStart(EmptyRequest) returns (WebAuthNOptionsResponse) {
    option (cp.policy) = { policy_type: ANY_OF scopes: "passkey:create" scopes: "default" };
  }

  rpc PostV1AuthPasskeyRegisterFinish(WebAuthNFinishRequest) returns (LoginResponse) {
    option (cp.policy) = { policy_type: ANY_OF scopes: "passkey:create" scopes: "default" };
  }

  rpc PostV1AuthPasskeyLoginStart(EmptyRequest) returns (WebAuthNOptionsResponse) {
    option (cp.policy) = { policy_type: NO_AUTH };
  }

  rpc PostV1AuthPasskeyLoginFinish(WebAuthNFinishRequest) returns (LoginResponse) {
    option (cp.policy) = { policy_type: NO_AUTH };
  }

  rpc GetV1AgentSessionsInstructions(cp.Empty) returns (cp.Empty) {
    option (cp.url) = "/v1/agent-sessions/instructions";
    option (cp.go_custom) = true;
    option (cp.policy) = { policy_type: NO_AUTH };
  }

  rpc PostV1AgentSessionsRequestStart(AgentSessionRequestStartRequest) returns (AgentSessionRequest) {
    option (cp.url) = "/v1/agent-sessions/request-start";
    option (cp.policy) = { policy_type: NO_AUTH };
  }

  rpc PostV1AgentSessionsGetSession(AgentSessionGetRequest) returns (AgentSessionPickup) {
    option (cp.url) = "/v1/agent-sessions/get-session";
    option (cp.policy) = { policy_type: NO_AUTH };
  }

  rpc PostV1AgentSessionsApprove(AgentSessionApproveRequest) returns (AgentSession) {
    option (cp.url) = "/v1/agent-sessions/approve";
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1AgentSessionsCreate(cp.Empty) returns (AgentSessionCreated) {
    option (cp.url) = "/v1/agent-sessions/create";
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1AgentSessionsList(EmptyRequest) returns (AgentSessionList) {
    option (cp.url) = "/v1/agent-sessions/list";
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1AgentSessionsRevoke(AgentSessionRevokeRequest) returns (cp.Empty) {
    option (cp.url) = "/v1/agent-sessions/revoke";
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1PersonalSessionsList(EmptyRequest) returns (PersonalSessionList) {
    option (cp.url) = "/v1/personal-sessions/list";
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1PersonalSessionsRevoke(PersonalSessionRevokeRequest) returns (cp.Empty) {
    option (cp.url) = "/v1/personal-sessions/revoke";
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1AccessRuleTemplatesList(EmptyRequest) returns (AuthzRuleTemplateList) {
    option (cp.url) = "/v1/access/rule-templates/list";
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1AccessRuleTemplatesCreate(AuthzRuleTemplateCreateRequest) returns (AuthzRuleTemplateRecord) {
    option (cp.url) = "/v1/access/rule-templates/create";
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1AccessRuleTemplatesUpdate(AuthzRuleTemplateUpdateRequest) returns (AuthzRuleTemplateRecord) {
    option (cp.url) = "/v1/access/rule-templates/update";
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1AccessRuleTemplatesDelete(AuthzRuleTemplateDeleteRequest) returns (cp.Empty) {
    option (cp.url) = "/v1/access/rule-templates/delete";
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1AccessGrantsList(EmptyRequest) returns (AuthzGrantList) {
    option (cp.url) = "/v1/access/grants/list";
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1AccessGrantsCreate(AuthzGrantCreateRequest) returns (AuthzGrantRecord) {
    option (cp.url) = "/v1/access/grants/create";
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1AccessGrantsDelete(AuthzGrantDeleteRequest) returns (cp.Empty) {
    option (cp.url) = "/v1/access/grants/delete";
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1AccessGlobalRulesList(EmptyRequest) returns (AuthzGlobalRuleList) {
    option (cp.url) = "/v1/access/global-rules/list";
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1AccessGlobalRulesCreate(AuthzGlobalRuleCreateRequest) returns (AuthzGlobalRuleRecord) {
    option (cp.url) = "/v1/access/global-rules/create";
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1AccessGlobalRulesDelete(AuthzGlobalRuleDeleteRequest) returns (cp.Empty) {
    option (cp.url) = "/v1/access/global-rules/delete";
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc GetV1GlobalState(cp.Empty) returns (GlobalState) {
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1GlobalStateStream(cp.Empty) returns (stream State) {
    option (cp.url) = "/v1/global/state-stream";
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1GlobalExportedConfig(EmptyRequest) returns (ExportedConfigBlob) {
    option (cp.url) = "/v1/global/exported-config";
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1DeploymentsGet(DeploymentGetRequest) returns (DeploymentState) {
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1DeploymentsCreate(DeploymentCreateRequest) returns (DeploymentConfig) {
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1DeploymentsUpdate(DeploymentUpdateRequest) returns (DeploymentConfig) {
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1DeploymentsMoveSpace(DeploymentSpaceMoveRequest) returns (DeploymentConfig) {
    option (cp.url) = "/v1/deployments/move-space";
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1DeploymentsDelete(DeploymentDeleteRequest) returns (cp.Empty) {
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1DeploymentsRecentlyDeleted(RecentlyDeletedDeploymentsRequest) returns (RecentlyDeletedDeployments) {
    option (cp.url) = "/v1/deployments/recently-deleted";
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1DeploymentsHistory(DeploymentHistoryRequest) returns (DeploymentHistory) {
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1DeploymentsVersions(DeploymentVersionsRequest) returns (DeploymentVersions) {
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1DeploymentsLogSearch(LogSearchRequest) returns (stream LogLineBatch) {
    option (cp.url) = "/v1/deployments/log-search";
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1DeploymentsPrepareOutput(PrepareOutputRequest) returns (stream PrepareOutputChunk) {
    option (cp.url) = "/v1/deployments/prepare-output";
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1ReposValidate(RepoValidateRequest) returns (RepoValidateResponse) {
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1NodesRename(NodeRenameRequest) returns (ClusterNode) {
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1NodesAllowedSpaces(NodeAllowedSpacesRequest) returns (ClusterNode) {
    option (cp.url) = "/v1/nodes/allowed-spaces";
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc GetV1NodesEnrollmentsInfo(cp.Empty) returns (NodeEnrollmentInfo) {
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1NodesEnrollmentsList(cp.Empty) returns (EnrollmentRequestList) {
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1NodesEnrollmentsAccept(EnrollmentAcceptRequest) returns (EnrollmentRequestStatus) {
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1SpacesCreate(SpaceSetRequest) returns (Space) {
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1SpacesUpdate(SpaceSetRequest) returns (Space) {
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1SpacesDelete(SpaceDeleteRequest) returns (cp.Empty) {
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1SecretsList(EmptyRequest) returns (SecretList) {
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1SecretsCreate(SecretCreateRequest) returns (Secret) {
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1SecretsSet(SecretSetRequest) returns (Secret) {
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1SecretsGenerate(SecretGenerateRequest) returns (Secret) {
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1SecretsRename(SecretRenameRequest) returns (Secret) {
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1SecretsMove(SecretMoveRequest) returns (Secret) {
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1SecretsReveal(SecretRevealRequest) returns (SecretRevealResponse) {
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1SecretsDelete(SecretDeleteRequest) returns (cp.Empty) {
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1SecretsStatus(EmptyRequest) returns (SecretsStatusResponse) {
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1SecretsRotateRecoveryCode(EmptyRequest) returns (SecretRecoveryCodeResponse) {
    option (cp.url) = "/v1/secrets/rotate-recovery-code";
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1SecretsUnlock(SecretUnlockRequest) returns (SecretsStatusResponse) {
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1ConfigsList(EmptyRequest) returns (ConfigList) {
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1ConfigsCreate(ConfigCreateRequest) returns (Config) {
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1ConfigsSet(ConfigSetRequest) returns (Config) {
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1ConfigsRename(ConfigRenameRequest) returns (Config) {
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1ConfigsDelete(ConfigDeleteRequest) returns (cp.Empty) {
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1ConfigsMove(ConfigMoveRequest) returns (Config) {
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1ValueDirectoriesList(EmptyRequest) returns (ValueDirectoryList) {
    option (cp.url) = "/v1/value-directories/list";
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1ValueDirectoriesCreate(ValueDirectoryCreateRequest) returns (ValueDirectory) {
    option (cp.url) = "/v1/value-directories/create";
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1ValueDirectoriesMove(ValueDirectoryMoveRequest) returns (ValueDirectory) {
    option (cp.url) = "/v1/value-directories/move";
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1ValueDirectoriesRename(ValueDirectoryRenameRequest) returns (ValueDirectory) {
    option (cp.url) = "/v1/value-directories/rename";
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1ValueDirectoriesDelete(ValueDirectoryDeleteRequest) returns (cp.Empty) {
    option (cp.url) = "/v1/value-directories/delete";
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1AssetsList(EmptyRequest) returns (AssetList) {
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  // Streams raw content bytes for one content version (?content_version_id=N).
  rpc GetV1AssetsContent(cp.Empty) returns (cp.Empty) {
    option (cp.url) = "/v1/assets/content";
    option (cp.go_custom) = true;
    option (cp.compression) = COMPRESSION_MODE_NEVER;
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1AssetsUpload(cp.Empty) returns (Asset) {
    option (cp.url) = "/v1/assets/upload";
    option (cp.go_custom) = true;
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1AssetsRename(AssetRenameRequest) returns (Asset) {
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1AssetsDelete(AssetDeleteRequest) returns (cp.Empty) {
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1AssetsMove(AssetMoveRequest) returns (Asset) {
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1AssetDirectoriesList(EmptyRequest) returns (AssetDirectoryList) {
    option (cp.url) = "/v1/asset-directories/list";
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1AssetDirectoriesCreate(AssetDirectoryCreateRequest) returns (AssetDirectory) {
    option (cp.url) = "/v1/asset-directories/create";
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1AssetDirectoriesMove(AssetDirectoryMoveRequest) returns (AssetDirectory) {
    option (cp.url) = "/v1/asset-directories/move";
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1AssetDirectoriesRename(AssetDirectoryRenameRequest) returns (AssetDirectory) {
    option (cp.url) = "/v1/asset-directories/rename";
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }

  rpc PostV1AssetDirectoriesDelete(AssetDirectoryDeleteRequest) returns (cp.Empty) {
    option (cp.url) = "/v1/asset-directories/delete";
    option (cp.policy) = { policy_type: ANY_OF scopes: "default" };
  }
}
