syntax = "proto3";

package opsagent.v1;

import "api-contract/model/assets.proto";
import "api-contract/model_assets_operations.proto";
import "api-contract/model/auth.proto";
import "api-contract/model_authz_operations.proto";
import "api-contract/model/backup.proto";
import "api-contract/model/configs.proto";
import "api-contract/model_configs_operations.proto";
import "api-contract/model/deployments.proto";
import "api-contract/model_directories_operations.proto";
import "api-contract/model_enrollment_operations.proto";
import "api-contract/model/network_policies.proto";
import "api-contract/model_network_policies_operations.proto";
import "api-contract/model/nodes.proto";
import "api-contract/model_nodes_operations.proto";
import "api-contract/model/primary_config.proto";
import "api-contract/model/secrets.proto";
import "api-contract/model_secrets_operations.proto";
import "api-contract/model/sessions.proto";
import "api-contract/model_sessions_operations.proto";
import "api-contract/model/spaces.proto";
import "api-contract/model_spaces_operations.proto";
import "api-contract/options.proto";

option go_package = "github.com/jptrs93/opsagent/backend/apigen";

// State is the UI stream envelope. The primary emits initial snapshots on
// subscribe, then emits updates as the store sees changes, with periodic
// heartbeats to keep the HTTP connection alive.
message State {
  bool heartbeat = 1;
  DeploymentSnapshot deployments_snapshot = 2;
  Deployment deployment_update = 3;
  repeated User users_snapshot = 4;
  User user_update = 5;
  EnrollmentRequestList enrollments_snapshot = 6;
  EnrollmentRequestStatus enrollment_update = 7;
  SecretsStatusResponse secrets_status_snapshot = 8;
  SecretList secret_metas_snapshot = 9;
  Secret secret_meta_update = 10;
  ConfigList user_config_values_snapshot = 11;
  Config user_config_value_update = 12;
  SpaceList spaces_snapshot = 13;
  Space space_update = 14;
  AssetList assets_snapshot = 15;
  Asset asset_update = 16;
  ClusterNodeList nodes_snapshot = 17;
  ClusterNode node_update = 18;
  ClusterNodeStatusList node_statuses_snapshot = 19;
  ClusterNodeStatus node_status_update = 20;
  BackupStatus backup_status_snapshot = 21;
  BackupStatus backup_status_update = 22;
  // Full redacted primary configuration, emitted initially and after every
  // persisted configuration change.
  PrimaryConfigVersion config_snapshot = 23 [(cp.go_value) = true];
  ScheduledInstanceSnapshot scheduled_instances_snapshot = 24;
  ScheduledInstanceState scheduled_instance_update = 25;
  // Filtered to the connected user before it is yielded, unlike every other
  // field here: agent sessions belong to one operator.
  AgentSessionList agent_sessions_snapshot = 26;
  AgentSession agent_session_update = 27;
  ValueDirectoryList value_directories_snapshot = 28;
  ValueDirectory value_directory_update = 29;
  AssetDirectoryList asset_directories_snapshot = 30;
  AssetDirectory asset_directory_update = 31;
  // Authz collections are small and mutate rarely, so each change re-emits the
  // full snapshot instead of tombstoning hard-deleted grants and rules.
  AuthzRuleTemplateList authz_rule_templates_snapshot = 32;
  AuthzGrantList authz_grants_snapshot = 33;
  AuthzGlobalRuleList authz_global_rules_snapshot = 34;
  // Network policies are small and mutate rarely; each change re-emits the
  // full snapshot like the authz collections.
  NetworkPolicyList network_policies_snapshot = 35;
}

message GlobalState {
  SpaceList spaces = 1;
  AssetList assets = 2;
  ConfigList configs = 3;
  SecretList secrets = 4;
  DeploymentSnapshot deployments = 5;
  ValueDirectoryList value_directories = 6;
  AssetDirectoryList asset_directories = 7;
}
