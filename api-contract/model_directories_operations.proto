syntax = "proto3";

package opsagent.v1;

import "api-contract/options.proto";
import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/jptrs93/opsagent/backend/apigen";

message ValueDirectoryList {
  repeated ValueDirectory items = 1;
}

message ValueDirectoryCreateRequest {
  uint64 space_id = 1 [(cp.js_type) = "number"];
  optional uint64 parent_id = 2 [(cp.js_type) = "number"]; // absent = the space root
  string key = 3;
}

message ValueDirectoryMoveRequest {
  uint64 directory_id = 1 [(cp.js_type) = "number"];
  optional uint64 new_parent_id = 2 [(cp.js_type) = "number"]; // absent = the root of the target space
  optional uint64 space_id = 3 [(cp.js_type) = "number"];      // absent = the current space
}

message ValueDirectoryRenameRequest {
  uint64 directory_id = 1 [(cp.js_type) = "number"];
  string new_key = 2;
}

message ValueDirectoryDeleteRequest {
  uint64 directory_id = 1 [(cp.js_type) = "number"]; // must be empty: contents are never cascaded
}

message AssetDirectoryList {
  repeated AssetDirectory items = 1;
}

message AssetDirectoryCreateRequest {
  uint64 space_id = 1 [(cp.js_type) = "number"];
  optional uint64 parent_id = 2 [(cp.js_type) = "number"]; // absent = the space root
  string key = 3;
}

message AssetDirectoryMoveRequest {
  uint64 directory_id = 1 [(cp.js_type) = "number"];
  optional uint64 new_parent_id = 2 [(cp.js_type) = "number"]; // absent = the root of the target space
  optional uint64 space_id = 3 [(cp.js_type) = "number"];      // absent = the current space
}

message AssetDirectoryRenameRequest {
  uint64 directory_id = 1 [(cp.js_type) = "number"];
  string new_key = 2;
}

message AssetDirectoryDeleteRequest {
  uint64 directory_id = 1 [(cp.js_type) = "number"]; // must be empty: contents are never cascaded
}
