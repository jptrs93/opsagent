syntax = "proto3";

package opsagent.v1;

import "api-contract/options.proto";
import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/jptrs93/opsagent/backend/apigen";

message NetworkPolicyCreateRequest {
  NetworkPolicyAction action = 1;
  NetworkPolicyPeer source = 2 [(cp.go_value) = true];
  NetworkPolicyPeer destination = 3 [(cp.go_value) = true];
  repeated NetPortMatch ports = 4;
}

message NetworkPolicyUpdateRequest {
  uint64 id = 1 [(cp.js_type) = "number"];
  int64 expected_seq = 2 [(cp.js_type) = "number"]; // 0 = no check
  NetworkPolicyAction action = 3;
  NetworkPolicyPeer source = 4 [(cp.go_value) = true];
  NetworkPolicyPeer destination = 5 [(cp.go_value) = true];
  repeated NetPortMatch ports = 6;
}

message NetworkPolicyDeleteRequest {
  uint64 id = 1 [(cp.js_type) = "number"];
}
