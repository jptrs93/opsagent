syntax = "proto3";

package opsagent.v1;

import "api-contract/model/network_policies.proto";
import "api-contract/model/networking.proto";

option go_package = "github.com/jptrs93/opsagent/backend/apigen";

message NetworkPolicyCreateRequest {
  NetworkPolicyAction action = 1;
  NetworkPolicyPeerRef source = 2;
  NetworkPolicyPeerRef destination = 3;
  repeated NetPortMatch ports = 4;
}

message NetworkPolicyUpdateRequest {
  int32 id = 1;
  reserved 2; // version: the ordinal check, before seqs were the concurrency token
  int64 expected_seq = 7; // seq of the policy's last mutation the caller saw; 0 = no check
  NetworkPolicyAction action = 3;
  NetworkPolicyPeerRef source = 4;
  NetworkPolicyPeerRef destination = 5;
  repeated NetPortMatch ports = 6;
}

message NetworkPolicyDeleteRequest {
  int32 id = 1;
}
