syntax = "proto3";

package opsagent.v1;

import "api-contract/options.proto";
import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/jptrs93/opsagent/backend/apigen";

message AgentSessionList {
  repeated AgentSession items = 1;
}

// AgentSessionCreated carries the one and only delivery of a new session's
// token. It is not a LoginResponse: the token is not a browser session.
message AgentSessionCreated {
  string token = 1;
  AgentSession session = 2 [(cp.go_value) = true];
}

message AgentSessionRevokeRequest {
  string session_id = 1;
}

message UserSessionList {
  repeated UserSession items = 1;
}

message UserSessionRevokeRequest {
  string session_id = 1;
}

// AgentSessionRequestStartRequest is an agent's unauthenticated opening call:
// user_id says only whose approval queue the request lands in.
message AgentSessionRequestStartRequest {
  uint64 user_id = 1 [(cp.js_type) = "number"];
}

message AgentSessionRequest {
  string session_id = 1;
  string approval_code = 2;
  AgentSessionStatus status = 3;
  int64 request_expires_at = 4 [(cp.go_type) = "time.Time", (cp.js_type) = "Date"];
}

message AgentSessionGetRequest {
  string session_id = 1;
}

// AgentSessionPickup carries the token exactly once: on the first get-session
// call after approval. Every later call returns status alone.
message AgentSessionPickup {
  AgentSessionStatus status = 1;
  string token = 2;
  optional int64 expires_at = 3 [(cp.go_type) = "time.Time", (cp.js_type) = "Date"];
}

message AgentSessionApproveRequest {
  string session_id = 1;
}
