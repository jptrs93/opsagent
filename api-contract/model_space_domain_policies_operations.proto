syntax = "proto3";

package opsagent.v1;

import "api-contract/options.proto";
import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/jptrs93/opsagent/backend/apigen";

message SpaceDomainPolicyCreateRequest {
  string name = 1;
  bool disabled = 2;
  SpaceDomainRule rule = 3 [(cp.go_value) = true];
}

message SpaceDomainPolicyUpdateRequest {
  uint64 id = 1 [(cp.js_type) = "number"];
  int64 expected_seq = 2 [(cp.js_type) = "number"]; // 0 = no check
  string name = 3;
  bool disabled = 4;
  SpaceDomainRule rule = 5 [(cp.go_value) = true];
}

message SpaceDomainPolicyDeleteRequest {
  uint64 id = 1 [(cp.js_type) = "number"];
}
