syntax = "proto3";

package opsagent.v1;

import "api-contract/options.proto";
import "api-contract/deployment_model.proto";
import "api-contract/system_config_model.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/jptrs93/opsagent/backend/apigen";



// === Enrollment messages ===

message EnrollmentWorkerMsg {
  EnrollmentHello hello = 1;
}

message EnrollmentHello {
  string requesting_machine_id = 1;        // stable worker-generated ID; not the operator-chosen worker name
  bytes worker_certificate_request = 2;    // PEM CSR generated by the worker; private key stays local
  string opendeploy_version = 3;           // version currently running on the enrolling worker
  string underlay_address = 4;             // node address used as the outer endpoint for cross-node tunnels
}

message EnrollmentPrimaryMsg {
  EnrollmentRequestStatus request_status = 1;
  EnrollmentAccepted accepted = 2;
}

message EnrollmentRequestStatus {
  int32 id = 1;
  int64 created_at = 2 [(cp.go_type) = "time.Time", (cp.js_type) = "Date"];
  int64 updated_at = 3 [(cp.go_type) = "time.Time", (cp.js_type) = "Date"];
  string requesting_ip_address = 4;
  string requesting_machine_id = 5;
  string status = 6; // waiting | disconnected | accepted
  string opendeploy_version = 7;
  string underlay_address = 8;
}

message EnrollmentRequestList {
  repeated EnrollmentRequestStatus items = 1;
}

message EnrollmentInfo {
  string enrollment_tls_spki_sha256 = 1;
}

message EnrollmentAcceptRequest {
  int32 id = 1;
  string worker_name = 2;
}

message EnrollmentAccepted {
  int32 id = 1;
  string worker_name = 2;
  bytes ca_certificate = 3;
  bytes worker_certificate = 4;
  ClusterNetworkInfo cluster_network = 5;
  ScheduledInstanceState node_deployment = 6;
  ScheduledInstanceState node_net_deployment = 7;
  ClusterNetMap cluster_net_map = 8;
}

message GithubCredentials {
  string token = 1;
  int64 changed_at = 2 [(cp.go_type) = "time.Time", (cp.js_type) = "Date"];
}

message BackupStatus {
  bool configured = 1;
  bool running = 2;
  bool in_sync = 3;
  uint64 local_txid = 4;
  uint64 remote_txid = 5;
  int64 last_successful_sync_at = 6 [(cp.go_type) = "time.Time", (cp.js_type) = "Date"];
  string error = 7;
  bool asset_migration_running = 8;
  uint32 asset_pending = 9;
  bool asset_target_s3 = 10;
  string asset_error = 11;
}

message ClusterSecretsRequest {
  repeated int32 ids = 1;
}

message ClusterSecretValue {
  int32 id = 1;
  bytes value = 2;
}

message ClusterSecretsResponse {
  repeated ClusterSecretValue items = 1;
}

message ClusterConfigsRequest {
  repeated int32 ids = 1;
}

message ClusterConfigValue {
  int32 id = 1;
  string value = 2;
}

message ClusterConfigsResponse {
  repeated ClusterConfigValue items = 1;
}


// === Auth messages ===

message EmptyRequest {}

message MasterPasswordRequest {
  string password = 1;
  string username = 2;
}

message MasterPasswordVerifyRequest {
  string password = 1;
}

message MasterPasswordSaveRequest {
  string password = 1;
}

message LoginResponse {
  string token = 1;
  int32 user_id = 2;
  repeated string scopes = 3;
  string name = 4;
  int64 expiry = 5 [(cp.go_type) = "time.Time", (cp.js_type) = "Date"];
}

// AgentSessionStatus is the lifecycle of an agent session. Expiry is not one of
// these: it is derived from expires_at on read, so nothing has to sweep the
// table to keep the list honest.
enum AgentSessionStatus {
  AGENT_SESSION_STATUS_UNKNOWN = 0;
  AGENT_SESSION_PENDING = 1;   // requested by an agent, awaiting operator approval
  AGENT_SESSION_APPROVED = 2;  // approved; the token is minted on first pickup
  AGENT_SESSION_REJECTED = 3;  // operator declined, or the request went stale
  AGENT_SESSION_REVOKED = 4;   // was live, stopped by the operator
}

// AgentSession is the tracked record of a command-line or agent bearer token.
// It never carries the token itself: only the leading characters, enough to
// tell two sessions apart in a list.
message AgentSession {
  string id = 1;
  int64 created_at = 2 [(cp.go_type) = "time.Time", (cp.js_type) = "Date"];
  // Zero until the token is minted, which happens on first pickup rather than
  // at approval.
  int64 expires_at = 3 [(cp.go_type) = "time.Time", (cp.js_type) = "Date"];
  string token_prefix = 4;
  repeated string scopes = 5;
  // 6 was `bool revoked`, now covered by status.
  AgentSessionStatus status = 7;
  string requesting_address = 8;
  // Shown beside a pending request so the operator can match it against the
  // code their agent printed. Meaningless once the session is live.
  string approval_code = 9;
  int64 approved_at = 10 [(cp.go_type) = "time.Time", (cp.js_type) = "Date"];
}

message AgentSessionList {
  repeated AgentSession items = 1;
}

// AgentSessionCreated carries the one and only delivery of a new session's
// token. Deliberately not a LoginResponse: this token is not a browser session
// and must never be fed into the frontend's login state. The plaintext is not
// stored, so it cannot be retrieved again.
message AgentSessionCreated {
  string token = 1;
  AgentSession session = 2;
}

message AgentSessionRevokeRequest {
  string id = 1;
}

// AgentSessionRequestStartRequest is an agent's opening call. It is
// unauthenticated: user_id says only whose approval queue the request lands in,
// and grants nothing until that operator approves it.
message AgentSessionRequestStartRequest {
  int32 user_id = 1;
}

// AgentSessionRequest is what the requesting agent gets back. The two ids pull
// in opposite directions: `id` is the pickup secret and must stay private,
// while `approval_code` exists to be read out to the operator so they can tell
// this request apart from any other that reached the server.
message AgentSessionRequest {
  string id = 1;
  string approval_code = 2;
  AgentSessionStatus status = 3;
  int64 request_expires_at = 4 [(cp.go_type) = "time.Time", (cp.js_type) = "Date"];
}

message AgentSessionGetRequest {
  string id = 1;
}

// AgentSessionPickup carries the token exactly once: on the first get-session
// call after approval. Every later call returns status alone.
message AgentSessionPickup {
  AgentSessionStatus status = 1;
  string token = 2;
  int64 expires_at = 3 [(cp.go_type) = "time.Time", (cp.js_type) = "Date"];
}

message AgentSessionApproveRequest {
  string id = 1;
}

message WebAuthNOptionsResponse {
  string session_id = 1;
  bytes options_json = 2;
}

message WebAuthNFinishRequest {
  string session_id = 1;
  bytes credential_json = 2;
}

// === Secrets messages ===

// SecretMeta describes a stored secret WITHOUT its value. The encrypted value
// never leaves the server.
message SecretMeta {
  string name = 1;
  reserved 2;
  int64 created_at = 3 [(cp.go_type) = "time.Time", (cp.js_type) = "Date"];
  reserved 4;
  int32 updated_by = 5;
  int32 id = 6;
  bool deleted = 7;
  int32 space_id = 8;
  int32 version = 9;
}

message SecretList {
  repeated SecretMeta items = 1;
}

message SecretSetRequest {
  string name = 1;
  reserved 2;
  bytes value = 3;         // plaintext secret value; encrypted at rest, never returned
  int32 space_id = 4;
  bool update_referencing_deployments = 5;
  repeated DeploymentConfigVersionRef referencing_deployments = 6;
}

message SecretRenameRequest {
  string name = 1;
  string new_name = 2;
}

message SecretDeleteRequest {
  string name = 1;
}

message SecretRevealRequest {
  string name = 1;
  int32 id = 2;
}

message SecretRevealResponse {
  bytes value = 1;         // decrypted plaintext; returned only on explicit reveal
}

message SecretsStatusResponse {
  bool unlocked = 1;            // SMK is loaded; secrets can be read/written
  bool recovery_configured = 2; // a recovery code has been generated
}

message SecretRecoveryCodeResponse {
  string code = 1;         // shown to the operator exactly once
}

message SecretUnlockRequest {
  string code = 1;         // the recovery code
}

// === User config messages ===

message UserConfig {
  string name = 1;
  reserved 2;
  string value = 3;        // plaintext value; not encrypted at rest
  int64 created_at = 4 [(cp.go_type) = "time.Time", (cp.js_type) = "Date"];
  reserved 5;
  int32 updated_by = 6;
  int32 id = 7;
  bool deleted = 8;
  int32 space_id = 9;
  int32 version = 10;
}

message UserConfigList {
  repeated UserConfig items = 1;
}

message UserConfigSetRequest {
  string name = 1;
  reserved 2;
  string value = 3;
  int32 space_id = 4;
  bool update_referencing_deployments = 5;
  repeated DeploymentConfigVersionRef referencing_deployments = 6;
}

message UserConfigRenameRequest {
  string name = 1;
  string new_name = 2;
}

message UserConfigDeleteRequest {
  string name = 1;
}

// === Asset messages ===

message AssetMeta {
  string key = 1;
  int64 created_at = 2 [(cp.go_type) = "time.Time", (cp.js_type) = "Date"];
  int32 version = 3;
  string format = 4;       // e.g. text, nginx, yaml, json
  string location = 5;     // empty for inline blob-backed assets
  int32 size_bytes = 6;
  int32 id = 7;
  int32 space_id = 8;
  bool deleted = 9;
}

message Asset {
  string key = 1;
  int64 created_at = 2 [(cp.go_type) = "time.Time", (cp.js_type) = "Date"];
  int32 version = 3;
  string format = 4;
  string location = 5;
  bytes blob = 6;
  int32 id = 7;
  int32 space_id = 8;
  int32 size_bytes = 9;
}

message AssetList {
  repeated AssetMeta items = 1;
}

message AssetGetRequest {
  string key = 1;
  int32 version = 2; // 0 = latest
}

message AssetSetRequest {
  string key = 1;
  string format = 2;
  bytes blob = 3;
  int32 space_id = 4;
}

message AssetRenameRequest {
  string key = 1;
  string new_key = 2;
}

message AssetDeleteRequest {
  string key = 1;
}

// === Deployment config messages ===


// State is the UI stream envelope. The primary emits initial snapshots on
// subscribe, then emits updates as the store sees changes, with periodic
// heartbeats to keep the HTTP connection alive.
message State {
  bool heartbeat = 1;
  reserved 2, 3;
  reserved "deployments_snapshot", "deployment_update";
  DeploymentConfigSnapshot deployment_configs_snapshot = 4;
  DeploymentConfig deployment_config_update = 5;
  repeated User users_snapshot = 6;
  User user_update = 7;
  EnrollmentRequestList enrollments_snapshot = 10;
  EnrollmentRequestStatus enrollment_update = 11;
  SecretReferenceList secrets_snapshot = 12;
  SecretReference secret_update = 13;
  UserConfigReferenceList user_configs_snapshot = 14;
  UserConfigReference user_config_update = 15;
  SecretsStatusResponse secrets_status_snapshot = 16;
  SecretList secret_metas_snapshot = 17;
  SecretMeta secret_meta_update = 18;
  UserConfigList user_config_values_snapshot = 19;
  UserConfig user_config_value_update = 20;
  SpaceList spaces_snapshot = 21;
  Space space_update = 22;
  AssetList assets_snapshot = 23;
  AssetMeta asset_update = 24;
  ClusterNodeList nodes_snapshot = 25;
  ClusterNode node_update = 26;
  ClusterNodeStatusList node_statuses_snapshot = 27;
  ClusterNodeStatus node_status_update = 28;
  BackupStatus backup_status_snapshot = 29;
  BackupStatus backup_status_update = 30;
  // Full redacted primary configuration, emitted initially and after every
  // persisted configuration change.
  ConfigVersion config_snapshot = 31 [(cp.go_value) = true];
  ScheduledInstanceSnapshot scheduled_instances_snapshot = 32;
  ScheduledInstanceState scheduled_instance_update = 33;
  // Filtered to the connected user before it is yielded, unlike every other
  // field here: agent sessions belong to one operator.
  AgentSessionList agent_sessions_snapshot = 34;
  AgentSession agent_session_update = 35;
}

message Space {
  int32 id = 1;
  string name = 2;
  bool deleted = 3;
}

message SpaceList {
  repeated Space items = 1;
}

message GlobalState {
  SpaceList spaces = 1;
  AssetList assets = 2;
  UserConfigList configs = 3;
  SecretList secrets = 4;
  DeploymentConfigSnapshot deployment_configs = 5;
}

message DeploymentStateRequest {
  int32 id = 1;
}

message DeploymentState {
  DeploymentConfig config = 1;
  ScheduledInstanceSnapshot instances = 2;
}

message SpaceSetRequest {
  int32 id = 1;
  string name = 2;
}

message SpaceDeleteRequest {
  int32 id = 1;
}

message SecretReference {
  int32 id = 1;
  string name = 2;
  bool deleted = 3;
  int32 space_id = 4;
  int32 version = 5;
}

message SecretReferenceList {
  repeated SecretReference items = 1;
}

message UserConfigReference {
  int32 id = 1;
  string name = 2;
  bool deleted = 3;
  int32 space_id = 4;
  int32 version = 5;
}

message UserConfigReferenceList {
  repeated UserConfigReference items = 1;
}


message ClusterMachineList {
  repeated ClusterMachine items = 1;
}

message DeploymentHistoryEntry {
  DeploymentConfig config = 1;
  ScheduledInstanceStatus status = 2;
}

message DeploymentHistory {
  repeated DeploymentHistoryEntry entries = 1;
}

// === Storage-only messages ===

message User {
  int32 id = 1;
  string name = 2;
}


message WebAuthnCredential {
  bytes id = 1;
  bytes data = 2;
}

message InternalUser {
  int32 id = 1;
  bytes web_auth_n_id = 2;
  string name = 3;
  repeated WebAuthnCredential credentials = 4;
}

message PublicKeyRecord {
  string kid = 1;
  bytes key_bytes = 2;
}

// === Cluster status ===

message ClusterMachine {
  string name = 1;
  bool is_primary = 2;
  bool connected = 3;
  int64 connected_at = 4 [(cp.go_type) = "time.Time", (cp.js_type) = "Date"];
  string identifier = 5;
  int32 id = 6;
}

message ClusterNode {
  int32 id = 1;
  int32 enrollment_id = 2;
  string name = 3;
  string identifier = 4;
  repeated int32 roles = 5;
  string wg_public_key = 6;
  repeated string addresses = 7;
  int64 enrolled_at = 8 [(cp.go_type) = "time.Time", (cp.js_type) = "Date"];
}

message NodeRenameRequest {
  string identifier = 1;
  string name = 2;
}

message ClusterNodeList {
  repeated ClusterNode items = 1;
}

message ClusterNodeStatus {
  int32 id = 1;
  int32 node_id = 2;
  int64 last_connected_at = 3 [(cp.go_type) = "time.Time", (cp.js_type) = "Date"];
  bool is_connected = 4;
}

message ClusterNodeStatusList {
  repeated ClusterNodeStatus items = 1;
}

message ClusterStatusResponse {
  repeated ClusterMachine machines = 1;
}

// === Cluster protocol ===
//
// Primary and worker communicate over an HTTP/2 mTLS protobuf stream.
// Each frame is [unsigned-varint length][protobuf payload].
// Primary sends MsgToWorker; worker sends MsgToMaster.
// Dispatch on whichever field is non-nil.

message MsgToWorker {
  ScheduledInstanceSnapshot scheduled_instances_snapshot = 1;
  ScheduledInstanceState scheduled_instance_update = 2;
  PrepareOutputRequest prepare_log_request = 3;
  RunOutputRequest run_log_request = 4;
  DeploymentLogRequest deployment_log_request = 5;
  string stop_log_request_id = 6;  // Cancel an active log stream by its request_id.
  LogSearchRequest log_search_request = 7;
  // Cluster-wide network parameters, sent at the head of every session before
  // the scheduled-instances snapshot. Workers persist it and program the local
  // dataplane from it on boot before reaching the primary.
  ClusterNetworkInfo cluster_network = 8;
  ClusterNetMap cluster_net_map = 9;
  int32 cluster_protocol_version = 10;
}

// ClusterNetworkInfo carries the cluster-wide virtual network parameters.
// Inbound and outbound addresses are pure functions of the ULA prefix, space,
// deployment, instance ordinal, config version, and run number, so this is the
// only distributed IPAM state.
message ClusterNetworkInfo {
  bytes ula_prefix = 1; // 6 bytes: the RFC 4193 ULA /48 prefix, generated once at first primary startup
}

// ClusterNetMap is a complete placement and underlay snapshot targeted to one
// authenticated node. Sequence is monotonic within generation.
message ClusterNetMap {
  string generation = 1;
  int64 sequence = 2;
  int32 target_node_id = 3;
  bytes ula_prefix = 4;
  repeated ClusterNetMapNode nodes = 5;
  repeated ClusterNetMapRoute routes = 6;
}

message ClusterNetMapNode {
  int32 node_id = 1;
  string underlay_address = 2;
}

// ClusterNetMapRoute points one routed prefix at the node hosting it. Only two
// prefix lengths are legal: the /100 covering a (deployment, ordinal) instance,
// which follows the serving placement, and the /120 covering every run of one
// scheduled instance, which stays with that placement until it is finalized.
// Routing whole prefixes rather than individual addresses keeps container
// restarts out of the map entirely.
message ClusterNetMapRoute {
  string logical_prefix = 1;
  int32 hosting_node_id = 2;
}

// LocalRouteReport is a worker's complete routed-address set. It has no node ID;
// the primary binds it to the authenticated cluster session.
message LocalRouteReport {
  int64 revision = 1;
  repeated string logical_addresses = 2;
}

// NetMapStatus reports durable acceptance separately from kernel application.
message NetMapStatus {
  string accepted_generation = 1;
  int64 persisted_sequence = 2;
  int64 applied_sequence = 3;
  string reconciliation_error = 4;
}

// ClusterHello is the first frame sent by a worker on each authenticated
// cluster session.
message ClusterHello {
  string underlay_address = 1;
  int32 cluster_protocol_version = 2;
}

message MsgToMaster {
  ScheduledInstanceStatus status_write = 1;
  bytes log_data = 2;
  bool log_end = 3;
  string log_request_id = 4;  // Tags log_data/log_end with the originating request_id.
  LogLineBatch log_lines = 5 [(cp.go_value) = true];
  LocalRouteReport local_route_report = 6;
  NetMapStatus net_map_status = 7;
  ClusterHello cluster_hello = 8;
}

// === Dataplane netstate ===
//
// NetState is the configuration interface between the agent and the per-machine
// dataplane system deployment (DNS server today; ingress proxy in a later
// phase). The agent writes full snapshots with atomic write-rename into the
// dataplane deployment's data volume; the dataplane process loads the file at
// start and reacts to updates via file watching. It is a pure state consumer:
// no sockets, no DB access, no deltas.

message NetState {
  int64 seq = 1;               // monotonic; consumers ignore snapshots with seq <= last applied
  bytes ula_prefix = 2;        // 6-byte ULA /48 prefix
  string node_identifier = 3;  // immutable identifier of the node this snapshot was rendered for
  repeated DnsService dns_services = 4;
  repeated string upstream_resolvers = 5; // host's upstream DNS servers, "ip" or "ip:port"
  repeated NetIngress ingress = 6;
}

// DnsService is one deployment's discovery record set:
// {name}.{environment}.internal -> READY instance addresses.
message DnsService {
  string name = 1;        // normalized deployment name (underscores -> hyphens)
  string environment = 2; // normalized space name
  repeated Endpoint endpoints = 3;
}

// NetIngress is a node-local, rendered ingress route consumed by netproxy.
// It contains ready backend endpoints instead of deployment configuration.
message NetIngress {
  IngressKind kind = 1;
  string hostname = 2;
  TlsPassthroughNetIngress tls_passthrough = 3;
}

message TlsPassthroughNetIngress {
  int32 host_port = 1;
  repeated IngressBackend backends = 2;
}

message IngressBackend {
  string address = 1;
  int32 port = 2;
}
