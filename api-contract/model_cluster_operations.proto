syntax = "proto3";

package opsagent.v1;

import "api-contract/options.proto";
import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/jptrs93/opsagent/backend/apigen";

message GithubCredentials {
  string token = 1;
  int64 changed_at = 2 [(cp.go_type) = "time.Time", (cp.js_type) = "Date"];
}

// Primary and secondary communicate over an HTTP/2 mTLS protobuf stream.
// Each frame carries one field. cluster_protocol_version keeps tag 9 so a
// node on the previous contract still reads the refusal. The session head is
// the protocol version, then the node's complete NodeProjection as
// node_snapshot, then the outstanding Nix store resets; afterwards one
// NodeProjection as node_update per write event that touched the node.
message MsgToSecondary {
  reserved 1, 2, 5, 6, 7;
  DeploymentLogRequest deployment_log_request = 3;
  optional string stop_log_request_id = 4;   // cancel an active log stream or query by its request_id
  LogQueryRequest log_query_request = 8;
  uint32 cluster_protocol_version = 9;
  MetricsQueryRequest metrics_query_request = 10;
  MetricsLatestRequest metrics_latest_request = 11;
  NixStoreResets nix_store_resets = 12;      // outstanding operator store resets, at the session head and on change
  optional bool evicted = 13;
  NodeProjection node_snapshot = 14;
  NodeProjection node_update = 15;
}

message NixStoreResetItem {
  string repo = 1;
  int64 requested_at = 2 [(cp.go_type) = "time.Time", (cp.js_type) = "Date"];
}

message NixStoreResets {
  repeated NixStoreResetItem items = 1;
}

// ClusterHello is the first frame a secondary sends on each authenticated
// cluster session. cluster_protocol_version keeps tag 2.
message ClusterHello {
  string opendeploy_version = 1;
  uint32 cluster_protocol_version = 2;
  string runtime_versions = 3;
  NodeReported reported = 4 [(cp.go_value) = true];
}

// MsgToPrimary frames carry one field each. cluster_hello keeps tag 6.
message MsgToPrimary {
  ScheduledInstanceStatus status_write = 1;
  optional bytes log_data = 2;
  optional bool log_end = 3;
  optional string log_request_id = 4;        // tags log_data, log_end, and query replies with the originating request_id
  NetMapStatus net_map_status = 5;
  ClusterHello cluster_hello = 6;
  LogQueryResponse log_query_response = 7;
  optional string log_query_error = 8;       // secondary-side failure for the query tagged by log_request_id
  MetricsQueryResponse metrics_query_response = 9;
  MetricsLatestResponse metrics_latest_response = 10;
}

// ScheduledInstanceState is the authoritative runtime assignment view: the
// schedule row, the deployment version it pins, and the latest observed status.
message ScheduledInstanceState {
  ScheduledInstance instance = 1 [(cp.go_value) = true];
  DeploymentRecord config = 2 [(cp.go_value) = true];
  ScheduledInstanceStatus status = 3;
}

message NodeInstance {
  ScheduledInstance instance = 1 [(cp.go_value) = true];
  DeploymentRecord config = 2 [(cp.go_value) = true];
  google.protobuf.Timestamp status_watermark = 3;  // the updated_at of the newest status the primary holds; the node replays its history above it
}

// NodeProjection is one node's view of the cluster. As node_snapshot it is
// complete (every live instance, the map, the ACME subset); as node_update it
// carries only what one write event changed, with unchanged sections absent.
message NodeProjection {
  int64 seq = 1 [(cp.js_type) = "number"];         // non-decreasing per session; an acme-only update repeats the last seq
  repeated NodeInstance instances = 2;             // snapshot: every non-finalised instance on the node; update: the full rows the write changed
  ClusterNetMap net_map = 3;                       // snapshot: always; update: when the node's map content changed
  AcmeState acme = 4;                              // snapshot: always; update: when the node's acme subset changed
}

message ClusterSecretsRequest {
  repeated SecretRef refs = 1;
}

message ClusterSecretValue {
  SecretRef ref = 1 [(cp.go_value) = true];
  bytes value = 2;
}

message ClusterSecretsResponse {
  repeated ClusterSecretValue items = 1;
}

message ClusterConfigsRequest {
  repeated ConfigRef refs = 1;
}

message ClusterConfigValue {
  ConfigRef ref = 1 [(cp.go_value) = true];
  string value = 2;
}

message ClusterConfigsResponse {
  repeated ClusterConfigValue items = 1;
}

message ClusterIssuedTLSRequest {
  uint64 deployment_id = 1 [(cp.js_type) = "number"];
  uint32 deployment_spec_version = 2;
}

message ClusterIssuedTLSResponse {
  bytes cert_pem = 1;
  bytes key_pem = 2;
  bytes ca_cert_pem = 3;
  int64 issued_at = 4 [(cp.js_type) = "number"];
  int64 not_after = 5 [(cp.js_type) = "number"];
}

message ClusterRenewCertificateResponse {
  bytes cert_pem = 1;
  bytes ca_cert_pem = 2;
  int64 not_after = 3 [(cp.js_type) = "number"];
}
