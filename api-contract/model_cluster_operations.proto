syntax = "proto3";

package opsagent.v1;

import "api-contract/model/deployments.proto";
import "api-contract/model/logs.proto";
import "api-contract/model_logs_operations.proto";
import "api-contract/model_metrics_operations.proto";
import "api-contract/model/networking.proto";
import "api-contract/options.proto";
import "api-contract/model/scheduled_instances.proto";

option go_package = "github.com/jptrs93/opsagent/backend/apigen";

message GithubCredentials {
  string token = 1;
  int64 changed_at = 2 [(cp.go_type) = "time.Time", (cp.js_type) = "Date"];
}

// Primary and secondary communicate over an HTTP/2 mTLS protobuf stream.
message MsgToSecondary {
  ScheduledInstanceSnapshot scheduled_instances_snapshot = 1;
  ScheduledInstanceState scheduled_instance_update = 2;
  DeploymentLogRequest deployment_log_request = 5;
  string stop_log_request_id = 6;  // Cancel an active log stream or query by its request_id.
  // Cluster-wide network parameters, sent at the head of every session before
  // the scheduled-instances snapshot. Secondaries persist it and program the local
  // dataplane from it on boot before reaching the primary.
  ClusterNetworkInfo cluster_network = 7;
  ClusterNetMap cluster_net_map = 8;

  int32 cluster_protocol_version = 9;
  AcmeState acme_state = 10;
  LogQueryRequest log_query_request = 11;  // One-shot structured log query; reply is log_query_response.
  MetricsQueryRequest metrics_query_request = 12;    // One-shot metrics rollup; reply is metrics_query_response.
  MetricsLatestRequest metrics_latest_request = 13;  // Latest sample per running container; reply is metrics_latest_response.
  NixStoreResets nix_store_resets = 14;  // Outstanding operator store resets, sent at the session head and on change.
}

// NixStoreReset asks every node to reseed its Nix build store for one
// repository before the next build that starts after requested_at.
message NixStoreReset {
  string repo = 1;
  int64 requested_at = 2;  // epoch ms
}

message NixStoreResets {
  repeated NixStoreReset items = 1;
}

message NixStoreResetRequest {
  string repo = 1;
}

// ClusterHello is the first frame sent by a secondary on each authenticated
// cluster session.
message ClusterHello {
  string opendeploy_version = 6;
  string runtime_versions = 7;
  NodeReported reported = 5;
  int32 cluster_protocol_version = 2;
  reserved 1, 3, 4;
  reserved "underlay_address", "wg_public_key", "host_addresses";
}

message MsgToPrimary {
  ScheduledInstanceStatus status_write = 1;
  bytes log_data = 2;
  bool log_end = 3;
  string log_request_id = 4;  // Tags log_data/log_end/log query replies with the originating request_id.
  NetMapStatus net_map_status = 5;
  ClusterHello cluster_hello = 6;
  LogQueryResponse log_query_response = 7;
  string log_query_error = 8;  // Secondary-side failure for the query tagged by log_request_id.
  MetricsQueryResponse metrics_query_response = 9;    // Tagged by log_request_id.
  MetricsLatestResponse metrics_latest_response = 10; // Tagged by log_request_id.
}

message ClusterSecretsRequest {
  repeated int32 ids = 1;
}

message ClusterSecretValue {
  int32 id = 1;
  bytes value = 2;
}

message ClusterSecretsResponse {
  repeated ClusterSecretValue items = 1;
}

message ClusterConfigsRequest {
  repeated int32 ids = 1;
}

message ClusterConfigValue {
  int32 id = 1;
  string value = 2;
}

message ClusterConfigsResponse {
  repeated ClusterConfigValue items = 1;
}

message ClusterIssuedTLSRequest {
  int32 deployment_id = 1;
  int32 deployment_spec_version = 2;
}

message ClusterIssuedTLSResponse {
  bytes cert_pem = 1;
  bytes key_pem = 2;
  bytes ca_cert_pem = 3;
  int64 issued_at = 4;
  int64 not_after = 5;
}

message ClusterRenewCertificateResponse {
  bytes cert_pem = 1;
  bytes ca_cert_pem = 2;
  int64 not_after = 3;
}
