syntax = "proto3";

package opsagent.v1;

import "api-contract/options.proto";
import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/jptrs93/opsagent/backend/apigen";

message ConfigCreateRequest {
  string key = 1;
  string value = 2;
  uint64 space_id = 3 [(cp.js_type) = "number"];
  optional uint64 value_directory_id = 4 [(cp.js_type) = "number"]; // absent = the space root
}

// ConfigSetRequest appends the next version of an existing config.
message ConfigSetRequest {
  uint64 config_id = 1 [(cp.js_type) = "number"];
  string value = 2;
  bool update_referencing_deployments = 3;
  repeated DeploymentExpectedSeq referencing_deployments = 4;
}

message ConfigRenameRequest {
  uint64 config_id = 1 [(cp.js_type) = "number"];
  string new_key = 2;
}

message ConfigDeleteRequest {
  uint64 config_id = 1 [(cp.js_type) = "number"];
}

message ConfigMoveRequest {
  uint64 config_id = 1 [(cp.js_type) = "number"];
  optional uint64 value_directory_id = 2 [(cp.js_type) = "number"]; // absent = the root of the target space
  optional uint64 space_id = 3 [(cp.js_type) = "number"];           // absent = the current space
}
